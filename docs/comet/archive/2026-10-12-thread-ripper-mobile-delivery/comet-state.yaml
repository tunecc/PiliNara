acceptance:
  - id: A1
    source: brief.md
    text: A1（TTFB 超时）：片 0 的 attempt 模拟 headers 永不完成 → TTFB 超阈值且存在替代主机时被 abort
      并由替代主机接管；无替代主机时保留等待（单测）。
    result: passed
    reason:
      text: scheduler_test.dart:802/829 双向单测：有替代主机时 ttfbSoft×0.85×2=2040ms 处
        abort(connectFail) 并由 hC 接管；单主机 3000ms<jobStallMs(8000) 保留等待。实现
        scheduler.dart:1668-1681 将 ttfbOver 判定置于 firstByteAt==0
        早退之前，media_transport_dio.dart 增加 receiveTimeout=12s 传输层兜底
      truncated: false
  - id: A2
    source: brief.md
    text: A2（片 0 优先）：serve 后首个上游请求为片 0（其余片在片 0 推进超过阈值后才启动）；mpv
      收到的首字节时间不再受其余片竞争影响（单测断言启动顺序）。
    result: passed
    reason:
      text: pacing_test.dart:109-132 断言首个上游请求 start==0、水位 0 时仅放行片 0/1（2MiB
        margin）、首棒钳制 8MiB；有序队列 + _pieceGated 使片 0 必然最先启动
      truncated: false
  - id: A3
    source: brief.md
    text: A3（片级消费门控）：消费水位落后超过 margin 时，未启动的片不 launch；水位推进后继续（单测：8MiB 棒模拟消费停滞 →
      上游请求停止增长）。
    result: passed
    reason:
      text: pacing_test.dart:150-179：水位 0 挡片 2/3，水位 2MiB 放行片 2、片 3
        仍挡（中间态断言）；scheduler_test A6
        零消费补完后无新请求。_pieceGated（scheduler.dart:1583-1587）按
        seg.start-base>ahead+2MiB 判定
      truncated: false
  - id: A4
    source: brief.md
    text: A4（hedge 门修复）：bandWidth 缺失（requiredRate=0）时投机复制以典型速率为基准受抑制；bandWidth
      正常时行为不变（单测）。
    result: passed
    reason:
      text: scheduler_test.dart:626-658：requiredRate=0 时 1B/ms 允许复制（无回退则 1>=0
        恒抑制、断言失败）、baseline 0.1 使判定翻转（基准值真实参与）、requiredRate 存在时忽略 baseline。实现
        scheduler.dart:265-273，两处调用点(1103/1862)传 typicalSpeed.rate
      truncated: false
  - id: A5
    source: brief.md
    text: A5（deadline 适配）：链式棒的 relief 触发频率随棒长适配——deadline 按 max(1500ms,
      棒长/requiredRate) 计算（单测）。
    result: passed
    reason:
      text: scheduler_test.dart:856-886 直测 Job.deadline：慢流
        8MiB/100=83886ms；8MiB/500000B/ms≈16ms<1500 取 1500（若误乘 1000 得 16777
        则失败，覆盖单位陷阱）。实现 scheduler.dart:613
      truncated: false
  - id: A6
    source: brief.md
    text: A6（seek 水位重置）：同 fileKey 新 Range 请求（新 first）到达时，旧消费水位清除，新链门控从零计算（单测）。
    result: passed
    reason:
      text: scheduler_test.dart:898-964：先补完 warm 16MiB（serve 钳制为两棒，循环 6 轮覆盖续棒并以无
        pending 断言收尾）释放 hostCap(6)；seek 回退后断言放行 2 片（无修复时 ahead=64MiB 放行 4
        片）、零消费时第二棒 0 请求。读码核对两向算术均成立
      truncated: false
  - id: A7
