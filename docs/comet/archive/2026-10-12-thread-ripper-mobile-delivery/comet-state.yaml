  - id: A10
    source: specs/thread-ripper-mobile-delivery/spec.md
    text: TTFB 挂起可中止 - **WHEN** 某 attempt 已发出请求但 TTFB 超过软阈值（×紧急系数×2）且该片段存在替代主机 -
      **THEN** 该 attempt 被中止并由替代主机接管；不再对未收到首字节的请求无限等待 - **WHEN** 不存在替代主机 -
      **THEN** 保留等待（避免打死唯一可达主机）
    result: passed
    reason:
      text: 同 A1：ttfbOver 中止需 attempts>1 或 _hasAlternative，否则保留等待至 jobStallMs
        既有兜底（scheduler.dart:1678-1681），双分支均有单测
      truncated: false
  - id: A11
    source: specs/thread-ripper-mobile-delivery/spec.md
    text: 片 0 优先 - **WHEN** 一个棒启动 - **THEN** 片 0（contiguous 前缀所在片）最先启动，其余片在片 0
      推进超过阈值后放行
    result: passed
    reason:
      text: 同 A2：pacing A1 断言片 0 最先发起、其余片待片 0 推进（水位）超阈值后放行
      truncated: false
  - id: A12
    source: specs/thread-ripper-mobile-delivery/spec.md
    text: 片级消费门控 - **WHEN** 播放器消费水位落后超过 margin（未启动片的 start 超过「本棒起点 + 已消费量 + margin」）
      - **THEN** 未启动的片不 launch；水位推进后继续按序启动 - **WHEN** 全部已启动片完成且消费仍未推进 - **THEN**
      流保持打开（不关闭不报错），等待消费 - **NOTE** 已消费量以本棒 range.first 为基准：seek
      或续棒后新棒起点高于文件级绝对水位时， 高于起点的部分不计为落后，否则陈旧/不连续水位会使新链门控误判为消费停滞而永久挂起。 播放器顺序播放时（水位
      = 绝对偏移）与文件级基准等价。
    result: passed
    reason:
      text: 门控公式与 spec 文字等价（seg.start > base+ahead+margin）；「已启动片完成且消费未推进→流保持打开」由
        pacing A2 尾部（第三棒 0 请求、errors 空、已收字节非空）与 A3（done 为 false）覆盖；基准取本棒
        range.first 的 NOTE 在 _pieceGated 注释与实现一致
      truncated: false
  - id: A13
    source: specs/thread-ripper-mobile-delivery/spec.md
    text: 投机制受码率基准约束 - **WHEN** bandWidth 缺失（requiredRate 无法计算） - **THEN** 投机复制与
      hedge 的判断以实测典型速率为基准，而不是恒开的 0 基准
    result: passed
    reason:
      text: 同 A4：bandWidth 缺失时以典型速率为基准，0 基准恒开门径被双向用例排除
      truncated: false
  - id: A14
    source: specs/thread-ripper-mobile-delivery/spec.md
    text: 链式棒 deadline 适配 - **WHEN** 链式棒长度大于上游 segment 量级 - **THEN** job deadline 按
      max(deadlineMs[cls], 棒长/requiredRate) 计算，消除慢性 relief 误触发 - **NOTE**
      requiredRate 单位是「字节每毫秒」（bandWidth/8000），棒长单位是字节， 故 棒长/requiredRate
      直接得到毫秒，不得再乘 1000。
    result: passed
    reason:
      text: 同 A5：max(deadlineMs[cls], 棒长/requiredRate)，requiredRate 为 B/ms，用例证明未多乘
        1000
      truncated: false
  - id: A15
    source: specs/thread-ripper-mobile-delivery/spec.md
    text: seek 水位重置 - **WHEN** 同 fileKey 的新 Range 请求到达且 first 与既有消费水位不连续 - **THEN**
      该 fileKey 的消费水位重置，新链门控从零计算
    result: passed
    reason:
      text: 同 A6：serve 内新 first 落后旧水位超 consumptionLookaheadBytes(4MiB)
        即把水位对齐到新起点（scheduler.dart:953-961），新链门控从零计算；前向 seek 由
        max(0,consumed-base) 兜底
      truncated: false
  - id: A16
    source: specs/thread-ripper-mobile-delivery/spec.md
    text: 发射与 flush 批量化 - **WHEN** 全速下载（高频小 chunk 到达） - **THEN** sink 发射与代理 flush
      按聚合条件（累计 ≥256KB 或距上次 ≥16ms）执行，单位时间系统调用与事件次数有界
    result: passed
    reason:
      text: sink：累计<256KB 且 <16ms 且未完成才暂缓（≥256KB 或 ≥16ms 或完成即发射，done/attach 绕过）；proxy
        flush：≥256KB 或 ≥16ms，流结束无条件收尾 flush——两侧聚合条件与 spec 一致且各有鉴别性单测
      truncated: false
