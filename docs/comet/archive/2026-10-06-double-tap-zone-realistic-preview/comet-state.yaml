    text: A1：在竖屏预览下进入页面，预览模拟真实半屏播放：顶部为 16:9
      黑色视频区（含三区色带、分隔线、中央播放图标、快退/快进秒数提示），下方为模拟视频页内容；拖拽分隔线在视频区内生效，百分比实时更新并遵守约束。
    result: passed
    reason:
      text: _buildPortraitPreview 视频区高=宽×9/16（含极矮屏压缩 max(120,maxHeight-24)），黑色
        _buildCanvas 含三区色带/双分隔线/中央播放图标/快退快进秒数提示，下方 _buildMockVideoPage 静态占位；拖拽经
        clampBackward/ForwardPercentDouble 且 _dragRefresh 驱动百分比实时刷新。
      truncated: false
  - id: A2
    source: brief.md
    text: A2：切换到「横屏预览」后，手机真实旋转为横屏（移动端系统栏隐藏），三区铺满整个屏幕，可全屏宽度拖拽分隔线；顶部悬浮操作与底部百分比提示可正常交互。
    result: passed
    reason:
      text: _setLandscape(true)→_enterLandscape 在移动端调用 hideSystemBar()+Android
        landscapeLeftMode()/iOS landscapeRightMode()（与 controller.dart
        changeOrientation 默认一致），_buildLandscapeBody 以 Positioned.fill
        铺满整屏并支持全屏宽度拖拽，顶部悬浮返回/竖屏预览/重置/保存与底部百分比提示齐备。
      truncated: false
  - id: A3
    source: brief.md
    text: A3：横屏预览下切回「竖屏预览」，或在该状态下直接按返回键离开页面，屏幕方向与系统栏均正确恢复，无横屏残留；恢复正常后页面功能不受影响。
    result: passed
    reason:
      text: 切回竖屏 _setLandscape(false)→_restorePortrait 执行
        showSystemBar()+Pref.horizontalScreen?fullMode():portraitUpMode()（与
        resetScreenRotation 语义一致）；dispose 中 if(_isLandscape)_restorePortrait()
        覆盖系统返回键与保存后 Get.back 的退出路径。
      truncated: false
  - id: A4
    source: brief.md
    text: A4：两种模式调整的是同一份配置：竖屏预览调整后切到横屏预览，分隔线位置同步；保存后播放器双击按配置生效（回归上一 change 的 A2/A4
      语义）。
    result: passed
    reason:
      text: 竖屏与横屏共用 _buildCanvas 读取同一份 _backwardPercent/_forwardPercent
        实例状态，模式切换不重置；_save/_reset 与 HEAD 逐字一致，仍写
        SettingBoxKey.doubleTapBackwardZone/ForwardZone。
      truncated: false
  - id: A5
    source: brief.md
    text: A5：恢复默认仍为 25% / 50% / 25%；保存 / 重置 / 返回流程不回归。
    result: passed
    reason:
      text: _reset 未改动，使用
        DoubleTapSeekLayout.defaultBackwardPercent/defaultForwardPercent=25（25/50/25）；_save
        仍为写入配置+toast+Get.back(result:true)，流程无回归。
      truncated: false
  - id: A6
    source: brief.md
    text: A6：桌面端进入横屏预览不调用设备旋转（不报错、不闪屏），以全屏宽度画布呈现并可拖拽。
    result: passed
    reason:
      text: _enterLandscape 与 _restorePortrait 均以 !PlatformUtils.isMobile
        提前返回，桌面端不触碰任何 SystemChrome 接口；横屏模式仅渲染 Positioned.fill 全屏宽度画布，分隔线可拖拽。
      truncated: false
