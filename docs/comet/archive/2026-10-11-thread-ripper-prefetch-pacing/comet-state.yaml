acceptance:
  - id: A1
    source: brief.md
    text: A1（首棒钳制）：总大小 200MiB 的 descriptor 收到 `bytes=0-`，serve 后第一个上游请求区间为 `[0,
      8MiB-1]`（不再是 64MiB）。
    result: passed
    reason:
      text: 独立核验：scheduler.dart serve 将超长/开放末端请求钳制到 first+8MiB-1（openEndedLegBytes 取代
        64MiB maxServedLength），AcceleratedResponse.last 仍报完整请求末端。pacing_test A1
        实测通过：200MiB 描述符收 bytes=0- 后上游请求恰为 4 片覆盖 [0,
        8MiB-1]（0-2MiB-1/2-4/4-6/6-8MiB），response.last=200MiB-1。断言真实、非自证。
      truncated: false
  - id: A2
    source: brief.md
    text: A2（消费驱动续棒）：模拟消费水位推进（经消费回调上报），水位 + 4MiB 提前量未达下一棒起点时不出现后续上游请求；推进越过阈值后下一棒请求出现。
    result: passed
    reason:
      text: 独立核验：_continueChain 仅当 consumed+4MiB 提前量 >= next.range.first 才 _start，否则挂
        _pendingSuccessor；noteConsumed 单调水位+即时 flush，tick 每 50ms
        重试挂起棒，无上游请求。pacing_test A2 三段断言核实真实：第一棒完成且水位 0 时 leg2
        请求数=0；noteConsumed(4MiB) 后 leg2 出现；第二棒完成且水位未推进时 leg3 保持 0
        请求；noteConsumed(12MiB) 后 leg3 启动。生产接线：proxy _serveAccelerated 每 chunk 上报
        delivered 绝对偏移经
        AcceleratedResponse.onConsumed→noteConsumed(fileKey=descriptor.originalUrl)；播放器暂停时
        response.flush() 背压使水位停滞，不预取。
      truncated: false
  - id: A3
    source: brief.md
    text: A3（流连续）：跨棒流式输出字节连续无重叠无缺口，总长度等于已服务区间；206 Content-Range 报告完整请求区间。
    result: passed
    reason:
      text: 独立核验流连续性：_complete 在门控判定前 sink.flush(job) 冲刷末次跳过 progress
        的尾部字节——挂起场景下尾部字节不再滞留 sink，消费水位精确到棒末端，不存在尾部滞留导致的死锁；attach() 先冲刷上一棒再切换，续棒以
        _requestFirst 绝对偏移发射（startRel=_emitted-jobStartOffset，正常为 0），startRel<0
        抛 StateError 防跨棒错位；_contiguous 封顶 job.length 防重叠。pacing_test A2 末段实测三棒累计
        24MiB 无 errors 无缺口、流保持打开。206 Content-Range 由 proxy 以
        accelerated.first/last（完整请求区间）+total 构造。
      truncated: false
  - id: A4
    source: brief.md
    text: A4（PCDN 默认排除）：`threadRipperBlockPcdn = true`（默认）时，mountaintoys/mcdn
      的直连地址不出现在 descriptor 候选中，官方镜像换签候选保留；无 upgcxcode 的 mcdnTf 地址被改写为 proxy-tf
      形式；szbdyd 地址被改写为 xy_usource 主机。
    result: passed
    reason:
      text: 独立核验 filterPcdnCandidates+rewritePlayable 接线：非 P2P
        主机（官方镜像及换签候选）原样保留；P2P+upgcxcode（mcdnUpgcxcode：edge.mountaintoys.cn/.mcdn.bilivideo/mirror14b/302*
        形态）落入 default 分支丢弃；mcdnTf（无 upgcxcode 的 /v1/resource 私有传输）改写
        https://proxy-tf-all-ws.bilivideo.com/?url=<orig>（与 video_utils._proxyTf
        同主机）；szbdyd 改写 xy_usource
        真实主机（缺参丢弃）。兜底被过滤时取首个幸存候选（候选耗尽则保留原兜底安全降级）；effectiveFallback 贯穿
        descriptor.originalUrl/_tokenByFile/_probeTotal/_learnTotal 与
        registry-miss 透传，键一致。classify_test 对 mountaintoys/szbdyd/mcdnUpgcxcode
        的分类断言在全量套件中执行通过，锚定过滤前提。注：无专项单测（见 risks）。
      truncated: false
  - id: A5
    source: brief.md
    text: A5（开关关闭回归）：`threadRipperBlockPcdn = false` 时 PCDN 直连候选恢复参与（上一 change 行为）。
    result: passed
    reason:
      text: 独立核验：Pref.threadRipperBlockPcdn 默认 true（storage_pref defaultValue:true +
        SwitchModel defaultVal:true）；为 false
        时整个过滤分支跳过，effectiveCandidates/effectiveFallback 等于原始输入，候选构造与改动前代码逐字一致（对照
        git diff 删除行），PCDN 直连恢复参与竞速。
      truncated: false
  - id: A6
    source: brief.md
    text: A6（回归）：`flutter analyze` 无问题；`flutter test` 全量通过。
    result: passed
    reason:
      text: 实测：fvm flutter test 全量 273 项全部通过（exit 0，含 thread_ripper 13 个文件与 utils
        回归）；fvm flutter analyze lib/services/thread_ripper
        lib/utils/video_utils.dart lib/pages/setting/models/video_settings.dart
        报 No issues found。scheduler_test A6 已重写为 8MiB 棒长+消费门控（水位 0
        无续棒、noteConsumed(4MiB) 后 leg2 区间 8388608-9437183 出现）。
      truncated: false
  - id: A7
    source: specs/thread-ripper-prefetch-pacing/spec.md
    text: 首棒钳制 - **WHEN** descriptor 总大小已知且代理收到开放末端或超长 Range 请求 - **THEN** 第一棒服务区间为
      `[first, min(first + 8MiB - 1, 请求末端)]`，206 Content-Range 报告完整请求区间
    result: passed
    reason:
      text: spec 首棒钳制 = A1：serve 仅当请求跨度 > 8MiB 才钳制，等价 [first, min(first+8MiB-1,
        请求末端)]；有界短 Range 不受影响；Content-Range 报完整请求区间。与 spec Scenario 逐字一致。
      truncated: false
  - id: A8
    source: specs/thread-ripper-prefetch-pacing/spec.md
    text: 消费驱动续棒 - **WHEN** 当前棒完成且消费水位 + 4MiB 提前量未达下一棒起点 - **THEN**
      下一棒挂起，不产生上游请求；消费水位推进越过阈值后下一棒自动启动 - **WHEN** 播放器暂停消费（水位长期不动） - **THEN**
      不再预取（挂起保持），不占带宽
    result: passed
    reason:
      text: spec 消费驱动续棒 = A2：完成时水位+4MiB 未达下一棒起点即挂起且不产生上游请求；noteConsumed/tick
        双路径自动启动；水位长期不动则挂起保持、不占带宽（无在途请求，仅参数暂存）。与 spec 一致。
      truncated: false
  - id: A9
    source: specs/thread-ripper-prefetch-pacing/spec.md
    text: 流连续性 - **WHEN** 跨棒交付 - **THEN** 字节连续无重叠无缺口，总长度等于已服务区间；消费落后时字节暂存待发，不丢不乱
    result: passed
    reason:
      text: spec 流连续性 = A3：跨棒字节连续无重叠无缺口、总长度=已服务区间、消费落后时字节暂存待发（sink
        缓冲未发射字节，attach/flush 冲刷）不丢不乱。与 spec 一致。
      truncated: false
  - id: A10
    source: specs/thread-ripper-prefetch-pacing/spec.md
    text: "直连地址默认排除（Scenario: 开关关闭恢复） - **WHEN** 屏蔽开关为默认开启，候选含 PCDN
      直连地址（mountaintoys/mcdn 的 upgcxcode 地址、裸形态） - **THEN** upgcxcode 形态的 PCDN
      地址从候选中移除（其换签候选保留官方镜像可达性）；无 upgcxcode 的 mcdn 私有传输改写为 proxy-tf 代理形式；szbdyd
      改写为 `xy_usource` 真实主机；兜底地址若被排除则取首个幸存候选 - **WHEN** 用户关闭屏蔽开关 - **THEN** PCDN
      直连候选恢复参与竞速（上一行为）"
    result: passed
    reason:
      text: spec 直连默认排除 = A4：默认开启时 upgcxcode 形态 PCDN 移除、mcdn 私有传输改 proxy-tf、szbdyd 改
        xy_usource、兜底被排除取首个幸存候选；关闭开关恢复参与（A5）。与 spec 一致。
      truncated: false
