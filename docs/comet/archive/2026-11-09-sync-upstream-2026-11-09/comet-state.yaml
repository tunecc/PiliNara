idgets/player_focus.dart` 的 >100% 路径均经 `setVolumeCapped`；同时 `maxVolume`、`gestureVolumeMax`、`volumeBoostUnlocked`、`Pref.enableVolumeBoost`、`Pref.enableAppVolume`、`Pref.maxVolume` 仍存在且被使用（`lib/` 引用计数非 0），fork 的「音量增强需二次确认解锁 200%」与桌面最大音量设置行为不变。"},{"id":"A5","source":"brief.md","text":"A5: 离线字幕/视角全收且 fork 入口幸存：`lib/utils/subtitle_utils.dart` 与 `download_service` 中的字幕/章节缓存逻辑在位；`lib/pages/video/widgets/header_control.dart` 不再包含被迁走的字幕下载实现；同文件中 fork 的作者专属倍速入口仍在（`author_play_speed`/作者倍速相关引用非 0）；`view_point` 跳转与视角偏好入口可达。"},{"id":"A6","source":"brief.md","text":"A6: 推荐源多选落地：`lib/models/common/rcmd_source.dart`、`Pref.rcmdSources`、`SettingBoxKey.rcmdSources`、设置页的带说明多选对话框均存在；`lib/pages/rcmd/controller.dart` 按多源交错取数；`lib/` 内不存在 `Pref.rcmdMode`/`RcmdMode` 的悬空调用（若上游保留定义但无消费者，允许定义存在，调用计数为 0）；fork 的 `AutoScrollPhysics` 仍在 `rcmd/view.dart` 生效。"},{"id":"A7","source":"brief.md","text":"A7: fork 自有功能全量幸存：ThreadRipper（`lib/services/thread_ripper/**` 文件数与合并前一致）、屏蔽画质、双击区域调整与预览、两指轻点暂停、作者专属倍速、会员视频本地筛选、我的页横向预览卡片与稍后再看直删、推荐页滚动、悬浮底栏三种显示样式；对应标识在 `lib/` 内引用计数均非 0，且与合并前基线持平。"},{"id":"A8","source":"brief.md","text":"A8: 版本线与钉版：`pubspec.yaml` 仍含 `connectivity_plus: 7.0.0`、`device_info_plus: 13.0.0`、`file_picker: 12.0.0-beta.7`，`environment.flutter` 与 `.fvmrc` 均为 `3.47.9`，`version` 与上游 `pubspec.yaml` 一致；`dlna_dart` 为 `^0.1.2` 且 `pubspec.yaml` 内不再有 `dlna-dart.git` 的 git 源。"},{"id":"A9","source":"brief.md","text":"A9: fork 保留项与 CI：README 差异说明正文仍在、`BUILD_IOS.md`、`lib/scripts/patch.sh` 存在；`.github/workflows` 仍只有 `sync_upstream_build.yml`、`android_reusable.yml`、`ios.yml`，`linux_x64.yml` 与其余已裁剪 workflow 均不存在，`ios.yml` 保留 `ref`/`artifact_name`/`file_suffix` 输入。"},{"id":"A10","source":"brief.md","text":"A10: 依赖刷新：`pubspec.lock` 的 hosted URL 全为 `pub.flutter-io.cn`（0 条 pub.dev）；与上游 `pubspec.lock` 的结构化差异仅限三钉及其传递伴随包（`file_picker_darwin/linux/web/platform_interface`、`android/windows_file_picker`）；`material_ui`/`cupertino_ui` 版本与上游一致（1.10.0 / 1.1.6）。"},{"id":"A11","source":"brief.md","text":"A11: `flutter analyze` 相对合并前基线不新增 error / warning（存量 info 允许；基线以本 change 记录的合并前计数为准）。"},{"id":"A12","source":"brief.md","text":"A12: `flutter test` 全部通过，包含上游新增测试 `test/cdn_node_store_test.dart`、`test/utils/dlna_utils_test.dart`、`test/utils/desktop/window_bounds_test.dart`、`test/video_utils_test.dart`、`test/pages/login/geetest/captcha_config_test.dart`；已知 flaky 项允许重跑一次并记录。"},{"id":"A13","source":"brief.md","text":"A13: `CHANGELOG.md` 的 `## [Unreleased]` 下新增「### 同步上游 2.6.2 批次（2026-11-09）」条目，内容涵盖本批吸收的上游主要能力与修复、fork 自有差异保持不变、`dlna_dart` 依赖形态变化与未恢复裁剪 workflow；既有条目与文件结构不被改写。"},{"id":"A14","source":"brief.md","text":"A14: `README.md` 保留 fork 的差异说明结构，且 Flutter 版本描述与 `.fvmrc` 一致（3.47.9，跟随上游），不再出现\"固定为 3.47.0…不跟随上游升级\"。"},{"id":"A15","source":"brief.md","text":"A15: 提交前工作树纯净：无补丁污染文件，`geetest_plugin.dart` 不在工作树；`git status` 仅包含本 change 的实现与正式产物；提交后 `git status` 干净。"},{"id":"A16","source":"brief.md","text":"A16: 上游本批新配置项落地可用：`showRefreshFAB` 在桌面设置页有入口并作用于推荐页 FAB；推荐源多选在推荐设置可达；`foldDepth` 影响楼中楼折叠；离线字幕/章节在下载后离线播放可用（代码路径存在，行为由上游实现保证）。"},{"id":"A17","source":"specs/upstream-sync/spec.md","text":"上游功能与缺陷修复全收 - **WHEN** 上游在本批范围内新增功能或修复缺陷，且 fork 对这些文件没有冲突性更改 - **THEN** 合并结果完整采用上游实现：推荐来源多选（`rcmd_source.dart`、`Pref.rcmdSources`、带说明的多选对话框、按勾选顺序交错取数）、桌面推荐页刷新 FAB（`showRefreshFAB`）与刷新指示器修复、评论楼中楼线程树（`reply_threaded_indent_box.dart`、`reply_reply/tree.dart`、`foldDepth`）、离线字幕/视角（`subtitle_utils.dart`、`download_service.dart`、`Pref.cachePlayInfo`、视角跳转与偏好）、>100% 音量 alimiter 限幅（`setVolumeCapped`）、音频会话与本地音频打开修复、直播横屏全屏安全区、小窗/通知栏刷新与弹幕按钮、桌面最小窗口尺寸（`window_bounds.dart`）、DLNA Lebo 控制 URL 归一（`dlna_utils.dart`）、搜索 `#` 视频标签筛选、AI 对话中途停止、iOS 短信验证码注册刷新、剧集滚动偏移、拖拽关闭长图、文章消息空图、按 issue 号的修复与依赖升级，不夹带 fork 侧的回退。"},{"id":"A18","source":"specs/upstream-sync/spec.md","text":"seek API 重构对齐且 fork 行为不回退 - **WHEN** 上游 `ef30e2482` 移除 `seek()` 与 `isSeek` 参数（原 `isSeek: true` 用于拖动进度条时等待首帧防抖） - **THEN** 合并后 `lib/` 内不存在任何 `isSeek` 引用；`PlPlayerController.seekTo` 只有一个 `Duration` 参数；fork 的全部调用点（`services/audio_handler.dart` 的 `seekToIfExists(position)`、`pages/video/controller.dart`、`plugin/pl_player/widgets/bottom_control.dart`、`plugin/pl_player/view/view.dart`、`pages/video/post_panel/view.dart`、`lib/utils/ios/pip_helper.dart`）对齐上游新签名；fork 的双击分向时长接线（SeekIndicator GlobalKey、`fastBackwardDuration`/`fastForwardDuration`）、两指轻点暂停、双击分区 `resolveType` 不回退；键盘 ←/→ 的分向时长单触发路径保持。"},{"id":"A19","source":"specs/upstream-sync/spec.md","text":"音量 >100% 走限幅且 fork 音量能力保留 - **WHEN** 上游 `d7df91620` 将 mpv 音量恒 ≤100、>100% 增益挪入 af 链 `alimiter=level_in=X:limit=1:level=0`（`setVolumeCapped`，Android libmpv 无 volume 滤镜故用 alimiter） - **THEN** `lib/models/common/audio_normalization.dart` 的 `setVolumeCapped`/`_boostAf` 在位；`pl_player/controller.dart` `_initPlayer` 不再设置 `'volume'`/`'volume-max'`，改在创建后调用 `setVolumeCapped`；`pages/audio/controller.dart`、`pages/video/widgets/player_focus.dart` 的音量路径同样经 `setVolumeCapped`；fork 的桌面 `Pref.maxVolume`（≤300%）、移动端应用内音量模式（`enableAppVolume`/`Pref.appVolume`）、音量增强二次确认解锁 200%（`enableVolumeBoost`、`volumeBoostUnlocked`、`gestureVolumeMax`、`onVolumeGestureEnd`）语义全部保留且消费者计数不为 0。"},{"id":"A20","source":"specs/upstream-sync/spec.md","text":"离线字幕/视角全收且 fork 入口幸存 - **WHEN** 上游 `f67a90291` 将字幕下载逻辑迁出 `header_control.dart`（`subtitle_utils` + `download_service`），并在 `pages/video/controller.dart` 加入离线字幕/视角逻辑 - **THEN** `lib/utils/subtitle_utils.dart` 与下载服务的字幕/章节缓存路径在位；`header_control.dart` 不含被迁走的实现；同文件 fork 的作者专属倍速入口仍在；`pages/video/controller.dart` 中上游离线字幕/视角逻辑与 fork 的屏蔽画质（`blockedQualities`/`fallbackVideo` 兜底）与作者倍速（`applyAuthorDefaultSpeed`）共处、互不删除；视角跳转（`61409bb74`）与视角偏好（`8ba530518`）可用。"},{"id":"A21","source":"specs/upstream-sync/spec.md","text":"推荐源多选落地且 fork 滚动行为保留 - **WHEN** 上游 `e3aff4435`/`4fce4bb5a` 将推荐来源改为 `RcmdSource` 多选（`Pref.rcmdSources`，勾选顺序决定交错取数），`rcmd/controller.dart` 重写 - **THEN** `lib/models/common/rcmd_source.dart` 与设置页带说明多选对话框在位；`lib/` 内不存在 `Pref.rcmdMode`/`RcmdMode` 的悬空调用（定义允许保留但无消费者）；`rcmd/view.dart` 同时保留上游 `ScaffoldLayout` + `FloatingActionButton`（`Pref.showRefreshFAB`）与 fork 的 `AutoScrollPhysics` 包装。"},{"id":"A22","source":"specs/upstream-sync/spec.md","text":"fork 保留项与自有功能不受影响 - **WHEN** 合并涉及 fork 钉定文件、平台/脚本差异或 fork 自有功能所在区域 - **THEN** 合并后须满足： - `pubspec.yaml` 保持 `connectivity_plus: 7.0.0`、`device_info_plus: 13.0.0`、`file_picker: 12.0.0-beta.7`；`environment.flutter` 与 `.fvmrc` 均为 `3.47.9`；`version` 与上游一致；`dlna_dart` 改为 `^0.1.2`（上游已发布该版本）且不再用 git 源。 - README fork 差异说明正文、`BUILD_IOS.md`、`lib/scripts/patch.sh` 保留；README 中 Flutter 版本描述与 `.fvmrc` 一致（3.47.9）。 - ThreadRipper、屏蔽画质、双击区域调整与预览、两指轻点暂停、作者专属倍速、会员视频本地筛选、我的页横向预览卡片与稍后再看直删、推荐页滚动、悬浮底栏三种显示样式的入口、配置项与行为不变；`lib/services/thread_ripper/**` 文件数与合并前一致；fork 功能标识在 `lib/` 内引用计数非 0 且与合并前基线持平。"},{"id":"A23","source":"specs/upstream-sync/spec.md","text":"已裁剪 CI 保持删除 - **WHEN** 合并完成后检查 CI 与 workflow 目录 - **THEN** `.github/workflows/linux_x64.yml`（上游本批唯一改动的 workflow）保持 fork 的删除状态；`.github/workflows` 仍只有 `sync_upstream_build.yml`、`android_reusable.yml`、增强版 `ios.yml`，其余已裁剪 workflow 不恢复，`build.yml` 不存在。"},{"id":"A24","source":"specs/upstream-sync/spec.md","text":"文档记录 - **WHEN** 本批合并落地 - **THEN** `CHANGELOG.md` 在 `## [Unreleased]` 下新增「### 同步上游 2.6.2 批次（2026-11-09）」，涵盖本批吸收的上游主要能力与修复、fork 自有差异保持不变、`dlna_dart` 依赖形态变化与未恢复裁剪 workflow；既有条目不改写。上游 2.6.2 段落不整段搬运。"},{"id":"A25","source":"specs/upstream-sync/spec.md","text":"合并形态与工作树纯净 - **WHEN** 本次同步合并提交并完成本地验证 - **THEN** `main` 上新增恰好一个双亲 merge commit（parents = 合并前 `main` `09379e6c1` 与 `upstream/main`@`eca9c04eb`）；重新 fetch 后 `git rev-list --count HEAD..upstream/main` 为 0；工作树无冲突标记；`pubspec.lock` 由 fork 钉版与镜像重新解析得到且 hosted URL 无 pub.dev 条目，与上游 lock 的结构化差异仅限三钉及其传递伴随包；`flutter analyze` 相对合并前基线不新增 error/warning，`flutter test` 全部通过（含上游新增 5 个测试文件）；若执行过 `patch.sh`，补丁污染文件在提交前还原，`geetest_plugin.dart` 不在工作树。"},{"id":"A26","source":"specs/upstream-sync/spec.md","text":"撞车呈报规则 - **WHEN** fork 已实现的某功能，上游在本批中也做了同类实现（同一用户可见功能、不同写法） - **THEN** 该条目不自动裁决；由 Agent 呈报双方差异，用户选择保留 fork 版 / 采用上游版 / 融合，结论记入 brief `# 决策` 并落盘 - **本批排查结论**：上游未实现 fork 任何自有功能（fork 标识与中文关键词在上游全树 0 命中，fork 功能目录本批上游提交数为 0，双侧改动文件交集 16 个且不含 fork 功能主文件），无二选一项；4 个语义交互点均为\"上游结构 + fork 行为\"的融合，不是功能撞车。"}],"children":null,"formalHash":"ca5d880bf16a07d711bfff03d0d9c03092810b1d3f2ca3b41596f1ed82292bb5","semanticSnapshot":{"artifacts":[{"auxiliary":[],"commentsHash":"cda738d4fb7d0dbdff20df1cd09b859740e0671de31bcf78b8ddc8ff818dab92","contentHash":"2a586d2b6b157922a53d16776a73e80f065f550097c876ad53d930833972cab7","contractHash":"66c377cc18e60aa1d4cf19e0c9b301a66f92b3b7dccc0376cfac87e881c5882d","inputHash":"44a5a6d4898442da54e80965025be2713c380fbcfec2639c89b19ca6cb167d7c","legacyFingerprint":"d160b69b48872448cc3607db283ab3299545ffd34da56b2265dfcaa162ce4a69","source":"brief.md"},{"auxiliary":[],"commentsHash":"cda738d4fb7d0dbdff20df1cd09b859740e0671de31bcf78b8ddc8ff818dab92","contentHash":"cec798f0c49b6031538bf4b62b71dff362e9fbc82bccfb3e1c59d30e541c70f1","contractHash":"f914745d970e509cd5e10f7744d848e8d8e44509cd84bd76751728046cb09d39","inputHash":"58be1ae30b07516c20c27a87bed3f578a18c5dba0bb685b734b4e66ccb0eb999","legacyFingerprint":"b3ed51205e95ffed232f5306eecf51b164d853fb20d99244e454cff8e9e41d62","source":"specs/upstream-sync/spec.md"}],"schema":"comet.native.shape-semantics.v1"},"shapeConfirmationHash":"3f86beb4f3de566010c4e0eaaf296a88e2bae7591ed2c7922d35c6252d6c7929","specChanges":[{"capability":"upstream-sync","operation":"modify","source":"specs/upstream-sync/spec.md"}]}},{"sequence":3,"value":{"acceptance":[{"id":"A1","source":"brief.md","text":"A1: 合并后重新 `git fetch upstream`，`git rev-list --count HEAD..upstream/main` 为 0（上游停点 `eca9c04eb`）；`main` 上新增一个双亲 merge commit，两个 parent 分别为合并前 `main`（`09379e6c1`）与 `upstream/main`@`eca9c04eb`，恰好两行 parent；未使用 squash 或 rebase。"},{"id":"A2","source":"brief.md","text":"A2: 7 处冲突全部按范围裁决落定：`git grep -n '^<<<<<<<' -- lib .gitignore CHANGELOG.md README.md .github` 无结果；`lib/pages/rcmd/view.dart` 同时包含 `AutoScrollPhysics(` 与 `ScaffoldLayout(`/`FloatingActionButton(`；`lib/plugin/pl_player/controller.dart` 的 `_initPlayer` 中不再出现 `'volume-max'` 与 `'volume':`，且存在 `setVolumeCapped(` 调用；`pubspec.lock` 由重解析生成而非手工合并。"},{"id":"A3","source":"brief.md","text":"A3: seek API 对齐上游：`git grep -n 'isSeek' -- lib` 为 0 条；`lib/` 内不存在对已删除 `seek(Duration, {isSeek})` 方法的调用；`PlPlayerController.seekTo` 只有一个 `Duration` 参数；`lib/services/audio_handler.dart` 调用 `seekToIfExists(position)` 不传 `isSeek`。"},{"id":"A4","source":"brief.md","text":"A4: 音量融合成立：`lib/models/common/audio_normalization.dart` 含 `setVolumeCapped`/`alimiter` 实现；`pl_player/controller.dart`、`pages/audio/controller.dart`、`pages/video/widgets/player_focus.dart` 的 >100% 路径均经 `setVolumeCapped`；同时 `maxVolume`、`gestureVolumeMax`、`volumeBoostUnlocked`、`Pref.enableVolumeBoost`、`Pref.enableAppVolume`、`Pref.maxVolume` 仍存在且被使用（`lib/` 引用计数非 0），fork 的「音量增强需二次确认解锁 200%」与桌面最大音量设置行为不变。"},{"id":"A5","source":"brief.md","text":"A5: 离线字幕/视角全收且 fork 入口幸存：`lib/utils/subtitle_utils.dart` 与 `download_service` 中的字幕/章节缓存逻辑在位；`lib/pages/video/widgets/header_control.dart` 不再包含被迁走的字幕下载实现；同文件中 fork 的作者专属倍速入口仍在（`author_play_speed`/作者倍速相关引用非 0）；`view_point` 跳转与视角偏好入口可达。"},{"id":"A6","source":"brief.md","text":"A6: 推荐源多选落地：`lib/models/common/rcmd_source.dart`、`Pref.rcmdSources`、`SettingBoxKey.rcmdSources`、设置页的带说明多选对话框均存在；`lib/pages/rcmd/controller.dart` 按多源交错取数；`lib/` 内不存在 `Pref.rcmdMode`/`RcmdMode` 的悬空调用（若上游保留定义但无消费者，允许定义存在，调用计数为 0）；fork 的 `AutoScrollPhysics` 仍在 `rcmd/view.dart` 生效。"},{"id":"A7","source":"brief.md","text":"A7: fork 自有功能全量幸存：ThreadRipper（`lib/services/thread_ripper/**` 文件数与合并前一致）、屏蔽画质、双击区域调整与预览、两指轻点暂停、作者专属倍速、会员视频本地筛选、我的页横向预览卡片与稍后再看直删、推荐页滚动、悬浮底栏三种显示样式；对应标识在 `lib/` 内引用计数均非 0，且与合并前基线持平。"},{"id":"A8","source":"brief.md","text":"A8: 版本线与钉版：`pubspec.yaml` 仍含 `connectivity_plus: 7.0.0`、`device_info_plus: 13.0.0`、`file_picker: 12.0.0-beta.7`，`environment.flutter` 与 `.fvmrc` 均为 `3.47.9`，`version` 与上游 `pubspec.yaml` 一致；`dlna_dart` 为 `^0.1.2` 且 `pubspec.yaml` 内不再有 `dlna-dart.git` 的 git 源。"},{"id":"A9","source":"brief.md","text":"A9: fork 保留项与 CI：README 差异说明正文仍在、`BUILD_IOS.md`、`lib/scripts/patch.sh` 存在；`.github/workflows` 仍只有 `sync_upstream_build.yml`、`android_reusable.yml`、`ios.yml`，`linux_x64.yml` 与其余已裁剪 workflow 均不存在，`ios.yml` 保留 `ref`/`artifact_name`/`file_suffix` 输入。"},{"id":"A10","source":"brief.md","text":"A10: 依赖刷新：`pubspec.lock` 的 hosted URL 全为 `pub.flutter-io.cn`（0 条 pub.dev）；与上游 `pubspec.lock` 的结构化差异仅限三钉及其传递伴随包（`file_picker_darwin/linux/web/platform_interface`、`android/windows_file_picker`）；`material_ui`/`cupertino_ui` 版本与上游一致（1.10.0 / 1.1.6）。"},{"id":"A11","source":"brief.md","text":"A11: `flutter analyze` 相对合并前基线不新增 error / warning（存量 info 允许；基线以本 change 记录的合并前计数为准）。"},{"id":"A12","source":"brief.md","text":"A12: `flutter test` 全部通过，包含上游新增测试 `test/cdn_node_store_test.dart`、`test/utils/dlna_utils_test.dart`、`test/utils/desktop/window_bounds_test.dart`、`test/video_utils_test.dart`、`test/pages/login/geetest/captcha_config_test.dart`；已知 flaky 项允许重跑一次并记录。"},{"id":"A13","source":"brief.md","text":"A13: `CHANGELOG.md` 的 `## [Unreleased]` 下新增「### 同步上游 2.6.2 批次（2026-11-09）」条目，内容涵盖本批吸收的上游主要能力与修复、fork 自有差异保持不变、`dlna_dart` 依赖形态变化与未恢复裁剪 workflow；既有条目与文件结构不被改写。"},{"id":"A14","source":"brief.md","text":"A14: `README.md` 保留 fork 的差异说明结构，且 Flutter 版本描述与 `.fvmrc` 一致（3.47.9，跟随上游），不再出现\"固定为 3.47.0…不跟随上游升级\"。"},{"id":"A15","source":"brief.md","text":"A15: 提交前工作树纯净：无补丁污染文件，`geetest_plugin.dart` 不在工作树；`git status` 仅包含本 change 的实现与正式产物；提交后 `git status` 干净。"},{"id":"A16","source":"brief.md","text":"A16: 上游本批新配置项落地可用：`showRefreshFAB` 在桌面设置页有入口并作用于推荐页 FAB；推荐源多选在推荐设置可达；`foldDepth` 影响楼中楼折叠；离线字幕/章节在下载后离线播放可用（代码路径存在，行为由上游实现保证）。"},{"id":"A17","source":"specs/upstream-sync/spec.md","text":"上游功能与缺陷修复全收 - **WHEN** 上游在本批范围内新增功能或修复缺陷，且 fork 对这些文件没有冲突性更改 - **THEN** 合并结果完整采用上游实现：推荐来源多选（`rcmd_source.dart`、`Pref.rcmdSources`、带说明的多选对话框、按勾选顺序交错取数）、桌面推荐页刷新 FAB（`showRefreshFAB`）与刷新指示器修复、评论楼中楼线程树（`reply_threaded_indent_box.dart`、`reply_reply/tree.dart`、`foldDepth`）、离线字幕/视角（`subtitle_utils.dart`、`download_service.dart`、`Pref.cachePlayInfo`、视角跳转与偏好）、>100% 音量 alimiter 限幅（`setVolumeCapped`）、音频会话与本地音频打开修复、直播横屏全屏安全区、小窗/通知栏刷新与弹幕按钮、桌面最小窗口尺寸（`window_bounds.dart`）、DLNA Lebo 控制 URL 归一（`dlna_utils.dart`）、搜索 `#` 视频标签筛选、AI 对话中途停止、iOS 短信验证码注册刷新、剧集滚动偏移、拖拽关闭长图、文章消息空图、按 issue 号的修复与依赖升级，不夹带 fork 侧的回退。"},{"id":"A18","source":"specs/upstream-sync/spec.md","text":"seek API 重构对齐且 fork 行为不回退 - **WHEN** 上游 `ef30e2482` 移除 `seek()` 与 `isSeek` 参数（原 `isSeek: true` 用于拖动进度条时等待首帧防抖） - **THEN** 合并后 `lib/` 内不存在任何 `isSeek` 引用；`PlPlayerController.seekTo` 只有一个 `Duration` 参数；fork 的全部调用点（`services/audio_handler.dart` 的 `seekToIfExists(position)`、`pages/video/controller.dart`、`plugin/pl_player/widgets/bottom_control.dart`、`plugin/pl_player/view/view.dart`、`pages/video/post_panel/view.dart`、`lib/utils/ios/pip_helper.dart`）对齐上游新签名；fork 的双击分向时长接线（SeekIndicator GlobalKey、`fastBackwardDuration`/`fastForwardDuration`）、两指轻点暂停、双击分区 `resolveType` 不回退；键盘 ←/→ 的分向时长单触发路径保持。"},{"id":"A19","source":"specs/upstream-sync/spec.md","text":"音量 >100% 走限幅且 fork 音量能力保留 - **WHEN** 上游 `d7df91620` 将 mpv 音量恒 ≤100、>100% 增益挪入 af 链 `alimiter=level_in=X:limit=1:level=0`（`setVolumeCapped`，Android libmpv 无 volume 滤镜故用 alimiter） - **THEN** `lib/models/common/audio_normalization.dart` 的 `setVolumeCapped`/`_boostAf` 在位；`pl_player/controller.dart` `_initPlayer` 不再设置 `'volume'`/`'volume-max'`，改在创建后调用 `setVolumeCapped`；`pages/audio/controller.dart`、`pages/video/widgets/player_focus.dart` 的音量路径同样经 `setVolumeCapped`；fork 的桌面 `Pref.maxVolume`（≤300%）、移动端应用内音量模式（`enableAppVolume`/`Pref.appVolume`）、音量增强二次确认解锁 200%（`enableVolumeBoost`、`volumeBoostUnlocked`、`gestureVolumeMax`、`onVolumeGestureEnd`）语义全部保留且消费者计数不为 0。"},{"id":"A20","source":"specs/upstream-sync/spec.md","text":"离线字幕/视角全收且 fork 入口幸存 - **WHEN** 上游 `f67a90291` 将字幕下载逻辑迁出 `header_control.dart`（`subtitle_utils` + `download_service`），并在 `pages/video/controller.dart` 加入离线字幕/视角逻辑 - **THEN** `lib/utils/subtitle_utils.dart` 与下载服务的字幕/章节缓存路径在位；`header_control.dart` 不含被迁走的实现；同文件 fork 的作者专属倍速入口仍在；`pages/video/controller.dart` 中上游离线字幕/视角逻辑与 fork 的屏蔽画质（`blockedQualities`/`fallbackVideo` 兜底）与作者倍速（`applyAuthorDefaultSpeed`）共处、互不删除；视角跳转（`61409bb74`）与视角偏好（`8ba530518`）可用。"},{"id":"A21","source":"specs/upstream-sync/spec.md","text":"推荐源多选落地且 fork 滚动行为保留 - **WHEN** 上游 `e3aff4435`/`4fce4bb5a` 将推荐来源改为 `RcmdSource` 多选（`Pref.rcmdSources`，勾选顺序决定交错取数），`rcmd/controller.dart` 重写 - **THEN** `lib/models/common/rcmd_source.dart` 与设置页带说明多选对话框在位；`lib/` 内不存在 `Pref.rcmdMode`/`RcmdMode` 的悬空调用（定义允许保留但无消费者）；`rcmd/view.dart` 同时保留上游 `ScaffoldLayout` + `FloatingActionButton`（`Pref.showRefreshFAB`）与 fork 的 `AutoScrollPhysics` 包装。"},{"id":"A22","source":"specs/upstream-sync/spec.md","text":"fork 保留项与自有功能不受影响 - **WHEN** 合并涉及 fork 钉定文件、平台/脚本差异或 fork 自有功能所在区域 - **THEN** 合并后须满足： - `pubspec.yaml` 保持 `connectivity_plus: 7.0.0`、`device_info_plus: 13.0.0`、`file_picker: 12.0.0-beta.7`；`environment.flutter` 与 `.fvmrc` 均为 `3.47.9`；`version` 与上游一致；`dlna_dart` 改为 `^0.1.2`（上游已发布该版本）且不再用 git 源。 - README fork 差异说明正文、`BUILD_IOS.md`、`lib/scripts/patch.sh` 保留；README 中 Flutter 版本描述与 `.fvmrc` 一致（3.47.9）。 - ThreadRipper、屏蔽画质、双击区域调整与预览、两指轻点暂停、作者专属倍速、会员视频本地筛选、我的页横向预览卡片与稍后再看直删、推荐页滚动、悬浮底栏三种显示样式的入口、配置项与行为不变；`lib/services/thread_ripper/**` 文件数与合并前一致；fork 功能标识在 `lib/` 内引用计数非 0 且与合并前基线持平。"},{"id":"A23","source":"specs/upstream-sync/spec.md","text":"已裁剪 CI 保持删除 - **WHEN** 合并完成后检查 CI 与 workflow 目录 - **THEN** `.github/workflows/linux_x64.yml`（上游本批唯一改动的 workflow）保持 fork 的删除状态；`.github/workflows` 仍只有 `sync_upstream_build.yml`、`android_reusable.yml`、增强版 `ios.yml`，其余已裁剪 workflow 不恢复，`build.yml` 不存在。"},{"id":"A24","source":"specs/upstream-sync/spec.md","text":"文档记录 - **WHEN** 本批合并落地 - **THEN** `CHANGELOG.md` 在 `## [Unreleased]` 下新增「### 同步上游 2.6.2 批次（2026-11-09）」，涵盖本批吸收的上游主要能力与修复、fork 自有差异保持不变、`dlna_dart` 依赖形态变化与未恢复裁剪 workflow；既有条目不改写。上游 2.6.2 段落不整段搬运。"},{"id":"A25","source":"specs/upstream-sync/spec.md","text":"合并形态与工作树纯净 - **WHEN** 本次同步合并提交并完成本地验证 - **THEN** `main` 上新增恰好一个双亲 merge commit（parents = 合并前 `main` `09379e6c1` 与 `upstream/main`@`eca9c04eb`）；重新 fetch 后 `git rev-list --count HEAD..upstream/main` 为 0；工作树无冲突标记；`pubspec.lock` 由 fork 钉版与镜像重新解析得到且 hosted URL 无 pub.dev 条目，与上游 lock 的结构化差异仅限三钉及其传递伴随包；`flutter analyze` 相对合并前基线不新增 error/warning，`flutter test` 全部通过（含上游新增 5 个测试文件）；若执行过 `patch.sh`，补丁污染文件在提交前还原，`geetest_plugin.dart` 不在工作树。"},{"id":"A26","source":"specs/upstream-sync/spec.md","text":"撞车呈报规则 - **WHEN** fork 已实现的某功能，上游在本批中也做了同类实现（同一用户可见功能、不同写法） - **THEN** 该条目不自动裁决；由 Agent 呈报双方差异，用户选择保留 fork 版 / 采用上游版 / 融合，结论记入 brief `# 决策` 并落盘 - **本批排查结论**：上游未实现 fork 任何自有功能（fork 标识与中文关键词在上游全树 0 命中，fork 功能目录本批上游提交数为 0，双侧改动文件交集 16 个且不含 fork 功能主文件），无二选一项；4 个语义交互点均为\"上游结构 + fork 行为\"的融合，不是功能撞车。"}],"children":null,"formalHash":"ca5d880bf16a07d711bfff03d0d9c03092810b1d3f2ca3b41596f1ed82292bb5","semanticSnapshot":{"artifacts":[{"auxiliary":[],"commentsHash":"cda738d4fb7d0dbdff20df1cd09b859740e0671de31bcf78b8ddc8ff818dab92","contentHash":"2a586d2b6b157922a53d16776a73e80f065f550097c876ad53d930833972cab7","contractHash":"66c377cc18e60aa1d4cf19e0c9b301a66f92b3b7dccc0376cfac87e881c5882d","inputHash":"44a5a6d4898442da54e80965025be2713c380fbcfec2639c89b19ca6cb167d7c","legacyFingerprint":"d160b69b48872448cc3607db283ab3299545ffd34da56b2265dfcaa162ce4a69","source":"brief.md"},{"auxiliary":[],"commentsHash":"cda738d4fb7d0dbdff20df1cd09b859740e0671de31bcf78b8ddc8ff818dab92","contentHash":"cec798f0c49b6031538bf4b62b71dff362e9fbc82bccfb3e1c59d30e541c70f1","contractHash":"f914745d970e509cd5e10f7744d848e8d8e44509cd84bd76751728046cb09d39","inputHash":"58be1ae30b07516c20c27a87bed3f578a18c5dba0bb685b734b4e66ccb0eb999","legacyFingerprint":"b3ed51205e95ffed232f5306eecf51b164d853fb20d99244e454cff8e9e41d62","source":"specs/upstream-sync/spec.md"}],"schema":"comet.native.shape-semantics.v1"},"shapeConfirmationHash":"3f86beb4f3de566010c4e0eaaf296a88e2bae7591ed2c7922d35c6252d6c7929","specChanges":[{"capability":"upstream-sync","operation":"modify","source":"specs/upstream-sync/spec.md"}]}},{"sequence":8,"value":{"candidateId":"98001b9d53a244c06b8d24817d790cb95549b045f25330f41c6f6a9e8a86d18d","candidateInputFingerprintGate":"27004ff52c2d5ba71ed5ff449fa54595b8107e5e5fb