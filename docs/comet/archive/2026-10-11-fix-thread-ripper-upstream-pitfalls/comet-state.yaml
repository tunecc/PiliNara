  - id: A1
    source: brief.md
    text: A1（P2P 名单）：`isP2PCdnDomain('29e749o.edge.mountaintoys.cn')` 与
      `isP2PCdnDomain('b-baaa93cg2y85fbm6d2wwavz6ydx6f.edge.mountaintoys.cn')` 为
      true，且 `classifyCdnUrl` 对
      `https://29e749o.edge.mountaintoys.cn/upgcxcode/...`（含 `os=mcdn`
      与不含两种查询）返回 `mcdnUpgcxcode`；`upos-sz-mirrorali.bilivideo.com` 保持 false。
    result: passed
    reason:
      text: classify.dart isP2PCdnDomain 关键字表含
        .edge.mountaintoys.cn（classify.dart:172，子串匹配覆盖两个被测子域）；classifyCdnUrl 对
        mountaintoys + /upgcxcode/ 走 mcdnUpgcxcode 分支且与 os=mcdn
        查询无关（classify.dart:203-213）。classify_test.dart:313-331 为真实断言：两个子域
        isTrue、upos-sz-mirrorhw.bilivideo.com isFalse、含/不含 os=mcdn 均返回
        mcdnUpgcxcode。
      truncated: false
  - id: A2
    source: brief.md
    text: A2（可替换 host
      子域匹配）：`_isReplaceableMediaHost('29e749o.edge.mountaintoys.cn')` 为 true。
    result: passed
    reason:
      text: video_utils.dart _isReplaceableMediaHost 改为
        lower.endsWith('.edge.mountaintoys.cn')||=='edge.mountaintoys.cn'。thread_ripper_candidates_test.dart
        A2 用例经 threadRipperCandidates 行为验证：mountaintoys 包装地址产出 https://upos-sz-*
        换签候选非空（子域匹配失效时该断言必失败）。
      truncated: false
  - id: A3
    source: brief.md
    text: A3（换签剥离）：包装形态 URL
      `https://xy220x202x9x135xy.mcdn.bilivideo.cn:8082/v1/resource/upgcxcode/99/91/x/x-1-30080.m4s?...`
      经 `threadRipperCandidates` 产出**多个**不含 `/v1/resource`
      的官方镜像换签候选（`https://<节点>/upgcxcode/99/91/...`），且原始包装 URL 保留在列表中。
    result: passed
    reason:
      text: threadRipperCandidates（video_utils.dart）对含 /upgcxcode/ 的可替换 host 先
        normalizeUpgcxcodeUri 剥离 /v1/resource 再铺到 CDNService
        全部节点；candidates_test A3 断言剥离形态换签候选 >1 个且均不含 /v1/resource/、原始包装 URL
        保留在列表。
      truncated: false
  - id: A4
    source: brief.md
    text: A4（坏 fallback 消除）：playUrls 仅含包装形态地址时，`_pickCdnUrl` 返回的 fallback 为官方镜像 +
      剥离后路径（或 proxy-tf 改写），绝不包含「官方镜像 host + `/v1/resource` 路径」组合。
    result: passed
    reason:
      text: _pickCdnUrl 先对全部 urls 做 normalizeUpgcxcodeUri（preparedUrls），mcdnUpgcxcode
        捕获与 rebuild 重建（清 4483/8082 端口）均基于剥离后路径，官方镜像+/v1/resource
        组合在结构上不可产出；getcdnurl candidates_test A4 断言 fallback 为
        https://upos-sz-mirrorali.bilivideo.com/upgcxcode/... 且不含
        /v1/resource/；A4b 确认无包装地址行为不变。
      truncated: false
  - id: A5
    source: brief.md
    text: A5（akamai 档位）：upos 签名（无 hdnts）的换签候选列表不含 akamaized.net
      主机；签名家族与主机家族不匹配的候选档位为 foreign。
    result: passed
    reason:
      text: 换签侧：threadRipperCandidates 跳过 akamai 源 host、非 upos 签名源与 akamai 目标
        host，candidates_test A5 断言候选无 .akamaized.net 且换签数
        >1（防恒真）；档位侧：scheduler.dart ResolvedCandidate 构造器
        (family==akam)!=isAkamaiHost(hostname) → CandidateTier.foreign（rank 7
        最后尝试），scheduler_test 'family/host mismatch ranks foreign (A5)' 对真实
        ResolvedCandidate 断言 tier==foreign、匹配家族保持 listedMirror。
      truncated: false
  - id: A6
    source: brief.md
    text: A6（开放末端接管）：descriptor 总大小 200MiB、代理收到 `bytes=0-` 时，加速器接受请求（不因超过
      maxServedLength 拒绝），首个 206 的 Content-Range 报告 `bytes
      0-199999999/200000000`，流式输出按 64MiB 分棒连续无重叠无缺口（scheduler 单测以 mock transport
      断言字节序与区间）。
    result: passed
    reason:
      text: "scheduler.dart _serve：range.resolve 后 requestLast 保留请求末端，超
        maxServedLength 钳制为 first+maxServedLength-1 并把后继参数 (first:
        clampedLast+1, last: requestLast) 存入
        _successorParams；AcceleratedResponse.last=requestLast
        报完整区间，media_proxy_server 据此写 Content-Range。_complete 取后继 _start(next,
        sink) + sink.attach 续流；ResponseSink 以 _requestFirst 绝对偏移发射，attach 先
        _emitFromJob(previous) 冲刷上一棒尾字节，出现发射缺口时抛 StateError
        而非跨棒错位。scheduler_test A6 用例（total=65MiB、bytes=0-）：断言
        response.first/last/total=0/total-1/total、第一棒 4 片精确覆盖
        [0,64Mi-1]、续棒请求区间恰为 [64Mi,total-1] 连续、errors
        空、done、流长度==total，全部为具体区间/长度断言非恒真。"
      truncated: false
  - id: A7
    source: brief.md
    text: A7（排水上限）：mock 返回 200 + 大响应体时，`_discardBody` 在约 1MiB 或 2s 内取消读取（单测断言取消被调用）。
    result: passed
    reason:
      text: scheduler.dart
        discardBody：takeWhile(received<=discardCapBytes=1MiB)+.timeout(2s,onTimeout
        close)，fire-and-forget drain。scheduler_test A7 用例以自建 StreamController
        断言：第一块 1MiB 内未取消、第二块越限即 onCancel 触发、取消后再喂块 consumed 不再增长（取消后不消费）。
      truncated: false
  - id: A8
    source: brief.md
    text: A8（回归）：`flutter test` 全量通过（含既有 thread_ripper 测试）。
    result: passed
    reason:
      text: 独立运行：定向 fvm flutter test test/thread_ripper/ + 3 个 utils 测试 = 158 all
        passed（含 scheduler 712 行、classify 383 行用例集）；全量 fvm flutter test = 262
        all passed，0 失败 0 跳过异常。
      truncated: false
