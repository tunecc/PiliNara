pref.dart` 同时包含上游 ban-word API 与 fork 新增 Pref（`blockedVideoQualities`、`enableThreadRipper` / `threadRipperBlockPcdn`、`doubleTap*`、`enableTwoFingerTapPause`、`authorPlaySpeeds`），无重复定义、无调用点遗漏"},{"id":"A13","source":"specs/upstream-sync/spec.md","text":"撞车取舍 - **WHEN** fork 已实现的某功能，上游在本批次中也做了同类实现（同一功能、不同写法） - **THEN** 该条目不自动裁决；由 Agent 呈报双方差异，用户逐项选择保留 fork 版 / 采用上游版 / 融合，选择结论记入 brief `# Decisions` 并落盘 - **若排查后无撞车条目**，记录排查方式与“无撞车”结论，本场景以“零遗漏”为通过标准"},{"id":"A14","source":"specs/upstream-sync/spec.md","text":"合并形态与工作树纯净 - **WHEN** 本次同步合并提交并完成本地验证 - **THEN** merge commit 恰好两行 parent（合并前 `main` 与 `upstream/main`），重新 fetch 后 `git rev-list --count HEAD..upstream/main` 为 0；`flutter analyze` 相对合并前基线不新增 error / warning，`flutter test` 全部通过；若执行过 `patch.sh`，bottom_sheet / geetest 补丁污染文件在提交前已还原，`geetest_plugin.dart` 不在工作树，提交内容仅包含本 change 的实现与正式产物。"}],"children":null,"formalHash":"9d05d5de0ff271d32b6179997362e041dc5c1279f3546e0776a67849ad623630","shapeConfirmationHash":"bc4d6a87b894f354da66649d2a78f12904df03b5cd52f553f36fa36fbd9a5613","specChanges":[{"capability":"upstream-sync","operation":"modify","source":"specs/upstream-sync/spec.md"}]}}}}},{"sequence":1,"value":{"acceptance":[{"id":"A1","source":"brief.md","text":"A1: 合并后重新 `git fetch upstream`，`git rev-list --count HEAD..upstream/main` 为 0；merge commit 恰好两行 parent（合并前 main 与 upstream/main b5694ccda）。"},{"id":"A2","source":"brief.md","text":"A2: 下载续传修复在位：`lib/pages/download/detail/widgets/item.dart` 使用 `canActInPlace = isCompleted || onDelete != null` 语义；`lib/pages/download/downloading/view.dart` 队列项带有进入多选并勾选的 `customOnLongPress` 接线。"},{"id":"A3","source":"brief.md","text":"A3: 关键词过滤重构在位：`Pref.parseBanWordItems` 为唯一解析入口，`Pref.compileBanWord` 按项编译且单项失败只跳过该项，`RegExpListMatch.hasMatch` 生效；`Pref.parseBanWordToRegex` 已删除，仓库内无残留调用点；`test/pages/search_panel/keyword_filter_test.dart` 与实现匹配。"},{"id":"A4","source":"brief.md","text":"A4: `lib/utils/storage_pref.dart` 双端共存：ban-word 新 API 与 fork 的 `blockedVideoQualities`、`enableThreadRipper` /