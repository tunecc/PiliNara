ockPcdn`、`doubleTap*`、`enableTwoFingerTapPause`、`authorPlaySpeeds` 均在且无重复定义。"},{"id":"A5","source":"brief.md","text":"A5: 已裁剪 CI 保持删除：`.github/workflows/build.yml` 不存在，`win_x64.yml`、`win_x64_newlibmpv.yml` 等 8 个已裁剪 workflow 均未恢复；`sync_upstream_build.yml` 与增强版 `ios.yml` 未被改动或回退。"},{"id":"A6","source":"brief.md","text":"A6: fork 保留项幸存：`pubspec.yaml` 含三钉与 `environment.flutter: 3.47.0`；`.fvmrc` 为 `{\"flutter\": \"3.47.0\"}`；README fork 差异章节、`BUILD_IOS.md`、`lib/scripts/patch.sh` 存在。"},{"id":"A7","source":"brief.md","text":"A7: fork 六项功能全量幸存：`lib/services/thread_ripper/` 13 个文件与 `test/thread_ripper/` 用例齐全；屏蔽画质、双击区域调整与预览、两指轻点暂停、作者专属倍速、会员视频本地筛选的入口与行为未被本批合并改动。"},{"id":"A8","source":"brief.md","text":"A8: 验证与纯净：`fvm flutter analyze` 相对合并前基线不新增 error / warning（存量 info 允许）；`fvm flutter test` 全部通过；提交前工作树无补丁污染与 `geetest_plugin.dart` 残留，仅含本 change 的实现与正式产物。"},{"id":"A9","source":"brief.md","text":"A9: 撞车排查零遗漏：上游本批不存在与 fork 六项功能同类的实现；排查方式与证据记录于 brief D4；无新增撞车条目需要用户裁决。"},{"id":"A10","source":"specs/upstream-sync/spec.md","text":"上游缺陷修复全收 - **WHEN** 上游在 `e52ad34a5..b5694ccda` 范围内修改缺陷修复代码，且 fork 对这些文件没有自己的更改或更改可与之共存 - **THEN** 合并结果完整采用上游修复： - 关键词过滤按列表项逐项编译，命中任一即过滤；`Pref.parseBanWordItems` 是唯一解析入口，`Pref.compileBanWord` 对每一项独立编译且单项非法只跳过该项；`Pref.parseBanWordToRegex` 不再存在，仓库内无残留调用点；`RegExpListMatch.hasMatch` 供四个过滤器使用；`ListEditorDialog` 对非法行给出 `patternValidator` 与行内 `errorText`。 - 下载队列在进程被杀死后，等待中条目可继续下载；点击条件为 `canActInPlace = isCompleted || onDelete != null`；队列项长按进入多选并勾中该条，分P 页列表（不传 `onDelete`）保持点击播放。"},{"id":"A11","source":"specs/upstream-sync/spec.md","text":"已裁剪 CI 保持删除 - **WHEN** 上游修改了 fork 已裁剪删除的 workflow 文件（本批：`.github/workflows/build.yml` 新增 `build_win_x64_newlibmpv` 开关与 `win_x64_newlibmpv` job） - **THEN** 合并后 `.github/workflows/build.yml` 仍不存在，`win_x64.yml`、`win_x64_newlibmpv.yml` 等 8 个已裁剪 workflow 均不恢复；fork 自有的 `sync_upstream_build.yml` 与增强版 `ios.yml`（`ref` / `artifact_name` / `file_suffix` 输入）不被修改或回退。"},{"id":"A12","source":"specs/upstream-sync/spec.md","text":"fork 保留项与自有功能不受影响 