acceptance:
  - id: A1
    source: brief.md
    text: A1：进入「双击区域调整」页，可切换 横屏 / 竖屏
      预览模式；横屏预览呈横屏播放器画布形态（宽幅黑底），竖屏预览呈竖屏播放页画布形态（竖幅）；默认进入竖屏模式。
    result: passed
    reason:
      text: double_tap_seek_zone_setting.dart 的 SegmentedButton 提供竖屏/横屏切换，_isLandscape
        默认 false（默认竖屏），画布按 9:16/16:9 等比适配且黑底（0xFF070707）。
      truncated: false
  - id: A2
    source: brief.md
    text: A2：两种模式下均可拖拽左右分隔线调整区域宽度，拖拽过程中百分比实时更新，且遵守 1%~40%（左右）与中间 ≥20%
      的约束；任一模式下的调整保存后另一模式的预览同步反映同一份配置。
    result: passed
    reason:
      text: 两种模式共用 _backwardPercent/_forwardPercent 同一状态，拖拽经
        clampBackward/ForwardPercentDouble（左右1~40%、中间≥20%）实时经 _dragRefresh
        刷新预览与百分比 chip，保存写同一份 setting box。
      truncated: false
  - id: A3
    source: brief.md
    text: A3：预览画布包含中央播放/暂停图标与左右区域的双击动作提示（快退/快进图标 + 当前配置的秒数）；修改快进/快退时长设置后，提示中的秒数随之变化。
    result: passed
    reason:
      text: 画布中央为 play_arrow 图标，左右区显示「快退/快进 X 秒」且 X 在构建时读取
        Pref.doubleTapBackwardDuration/doubleTapForwardDuration，重新进入即反映最新时长配置。
      truncated: false
  - id: A4
    source: brief.md
    text: A4：保存后双击播放器按配置区域实际触发：例如左区设为 10% 时，双击画布左侧 10% 以内为快退、中间为播放暂停、右侧对应区域为快进；重启
      App 后配置保留。
    result: passed
    reason:
      text: view.dart onDoubleTapDownMobile 已改为
        plPlayerController.doubleTapSeekLayout.resolveType（getter 实时读
        Pref），保存即对下次双击生效并持久化于 Hive setting box；单测覆盖 10%/15% 边界与 width<=0 回退。
      truncated: false
  - id: A5
    source: brief.md
    text: A5：恢复默认操作可将区域重置为 25% / 50% / 25%（现状能力保留）。
    result: passed
    reason:
      text: 重置按钮将两值恢复为 defaultBackwardPercent/defaultForwardPercent=25（即
        25/50/25）并刷新预览，保存后持久化，符合规格保留现状。
      truncated: false
  - id: A6
    source: brief.md
    text: A6：直播播放与控制栏锁定状态下双击行为不变（忽略）。 功能二：
    result: passed
    reason:
      text: onDoubleTapDownMobile 首行保留 isLive || controlsLock.value 时直接 return 的现状分支。
      truncated: false
  - id: A7
    source: brief.md
    text: A7：播放 UGC 视频时，「更多设置」面板出现作者倍速入口，subtitle 显示作者名与设置状态（未设置 / 已设置 X.Xx）。
    result: passed
    reason:
      text: showSettingSheet 在 owner?.mid != null 时于「重载视频」组后显示「作者专属倍速」条目，subtitle
        为「作者名 · 未设置 / 已设置 X.Xx」。
      truncated: false
  - id: A8
    source: brief.md
    text: A8：点击入口就地弹出倍速选择弹窗，选择并保存后：作者倍速存储新增该作者记录，当前播放立即应用该倍速，面板关闭。
    result: passed
    reason:
      text: 点击先 Get.back() 关面板再弹 ChoiceChip 弹窗（选项 Pref.speedList），保存调用
        Pref.upsertAuthorPlaySpeed 并 await applyAuthorDefaultSpeed(mid,
        force:true) 立即生效，附 toast。
      truncated: false
  - id: A9
    source: brief.md
    text: A9：已设置专属倍速的作者再次打开入口，可看到当前倍速并可就地更换或移除；移除后当前播放回退全局默认倍速，存储中该作者记录删除。
    result: passed
    reason:
      text: 已设置作者打开时预选当前倍速并提供「移除专属倍速」，移除调用 Pref.removeAuthorPlaySpeed +
        resetAuthorDefaultSpeedToGlobal(force:true) 回退全局默认并删除存储记录。
      truncated: false
  - id: A10
    source: brief.md
    text: A10：播放番剧/影视（无作者）或本地文件时，不显示该入口。
    result: passed
    reason:
      text: PgcIntroController/LocalIntroController 仅写 videoDetail.title，owner 保持
        null，入口条件 owner?.mid != null 使番剧/影视与本地文件均不显示。
      truncated: false
  - id: A11
    source: brief.md
    text: A11：在倍速设置页的作者专属倍速列表中可以看到通过快捷入口添加/修改/删除的结果（同一存储，双向一致）。
    result: passed
    reason:
      text: 快捷入口与倍速设置页均经 Pref.authorPlaySpeeds 读写 Hive video box 的 authorPlaySpeeds
        键（play_speed_set.dart _persistAuthorSpeeds 亦写
        Pref.authorPlaySpeeds），双向一致；新增 Pref 存储单测覆盖增删改与回退。
      truncated: false
