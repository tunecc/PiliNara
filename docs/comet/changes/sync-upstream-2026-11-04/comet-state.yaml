存在与 fork 旧 `case arrowLeft:` 并存导致的单次按键两次快退；按 D5，`←` 连退与 `→` 单按的步长均取上游的 `Pref.fastForBackwardDuration`（`→` 分支回退为上游写法，键盘左右同源），fork 的 `fastBackwardDuration`/`fastForwardDuration` getter 因触屏双击路径仍引用而保留，设置页时长只作用于触屏双击。 - `VideoUtils.findTargetVideo` 记录首项返回 `targetVideo.id`（上游 `401ddbfdb`），fork 屏蔽画质路径在候选集为空时走 `fallbackVideo` 兜底而不是抛 `StateError`，且\"候选全被屏蔽时返回最高档\"的既有语义不变。 - `5b33aa18a` 的 Akamai 原始签名 URL 早退位于 fork 的 `pickCdnUrl` 内，返回未经 `normalizeUpgcxcodeUri` 剥包装的 URL，其与 `bypassCdnPreference` 的先后顺序可解释且 ThreadRipper 开启时行为成立。 - `pl_player/controller.dart` 中 fork 的 `fastBackwardDuration`/`fastForwardDuration` getter 与上游的 `fastForBackwardInSeconds` 并存可编译；`pages/video/controller.dart` 的 `findVideoByQa` 同时保住 `data.fallbackVideo(blockedQualities:)` 与 `fallback.id`；`introduction/ugc/controller.dart` 中 `updateIndex` 先于 `applyAuthorDefaultSpeed`，且 `cid` 初始化迁移不破坏同集 reinits 判定。"},{"id":"A17","reason":null,"result":"pending","source":"specs/upstream-sync/spec.md","text":"fork 保留项与自有功能不受影响 - **WHEN** 合并涉及 fork 钉定文件、平台/脚本差异或 fork 自有功能所在区域 - **THEN** 合并后须满足： - `pubspec.yaml` 保持 `connectivity_plus: 7.0.0`、`device_info_plus: 13.0.0`、`file_picker: 12.0.0-beta.7`；`environment.flutter` 与 `.fvmrc` 按 D4 均为 `3.47.9`（跟随上游，本机需安装该 SDK，CI 通过 `flutter-version-file: pubspec.yaml` 使用同一版本）；`version` 跟随上游 `2.2.0+1`；上游新增的 `nm`、`webview_all_linux`、`webview_platform_interface`、`window_manager ^0.6.0`、`dlna_dart` git 源、`permission_handler_platform_interface ^4.4.0` 全部在位。 - README fork 差异章节、`BUILD_IOS.md`、`lib/scripts/patch.sh`、fork 的平台文件差异（`android/app/build.gradle.kts`、`lib/scripts/build.ps1`、`macos` xcconfig/entitlements）保留。 - ThreadRipper、屏蔽画质、双击区域调整与预览、两指轻点暂停、作者专属倍速、会员视频本地筛选、我的页横向预览卡片与稍后再看直删、推荐页滚动与 fork 更新源/release manifest 的入口、配置项与行为不变；`lib/pages/member_video/**`、`lib/pages/mine/**`、`lib/pages/rcmd/**`、`lib/common/widgets/scroll_physics.dart`、`lib/utils/update.dart`、`lib/services/thread_ripper/**` 未被上游本批改动。 - `lib/utils/storage_pref.dart` 同时包含上游新增 Pref（`enableScrollVolume`、`hideSideBarLabel`、SC 三项、`blockSettings` 越界兜底）与 fork 新增 Pref（`blockedVideoQualities`、`enableThreadRipper`/`threadRipperBlockPcdn`、`doubleTap*`、`enableTwoFingerTapPause`、`authorPlaySpeeds` 及其方法），无重复定义、无调用点遗漏；`lib/utils/storage_key.dart` 双侧新增 key 不相交。"},{"id":"A18","reason":null,"result":"pending","source":"specs/upstream-sync/spec.md","text":"已裁剪 CI 保持删除 - **WHEN** 合并完成后检查 CI 与 workflow 目录 - **THEN** 上游本批未触及 `.github/`，`.github/workflows` 仍只有 fork 的 `sync_upstream_build.yml`、`android_reusable.yml`、增强版 `ios.yml`（保留 `ref` / `artifact_name` / `file_suffix` 输入），fork 已裁剪的 8 个 workflow 均不恢复，`build.yml` 仍不存在。"},{"id":"A19","reason":null,"result":"pending","source":"specs/upstream-sync/spec.md","text":"上游删除项的处置 - **WHEN** 上游删除文件或移除 fork 之前可见的配置能力 - **THEN** fork 未改过的删除跟随：`lib/pages/setting/pages/fullscreen_sc_size.dart`（改名 `fullscreen_sc.dart`）、`lib/pages/video/introduction/pgc/widgets/pgc_panel.dart`、`linux/runner/plugins/linux_webview_plugin.{cc,h}` 不残留引用；按 D6 接受上游移除 `Pref.buildLiveBuffer`、`static set buvid` 及其设置入口与 `test/utils/live_buffer_test.dart`，`lib/` 内对三者的引用计数为 0，`recommend_settings.dart` 不再出现手动输入 buvid 的入口，该消失项在发版说明中点名。"},{"id":"A20","reason":null,"result":"pending","source":"specs/upstream-sync/spec.md","text":"撞车与版本线取舍 - **WHEN** fork 已实现的某功能，上游在本批中也做了同类实现（同一用户可见功能、不同写法），或合并需要改变 fork 的构建/依赖钉版 - **THEN** 该条目不自动裁决；由 Agent 呈报双方差异，用户逐项选择保留 fork 版 / 采用上游版 / 融合，结论记入 brief `# Decisions` 并落盘 - **本批排查结论**：上游未实现 fork 任何自有功能（标识与中文关键词全树 0 命中，fork 功能目录本批上游提交数为 0），`bdf2859b3` 的 hover seek 预览与 fork 双击区域设置页预览表面和数据源不同，不构成同类实现；用户裁决的三项已定并记入 brief D4–D6 —— Flutter 版本线跟随上游 `3.47.9`、键盘左右步长统一取上游 `Pref.fastForBackwardDuration`、接受上游移除手动 buvid 输入与直播缓冲参数；另有 D7 将两处 fork 既存缺陷纳入本 change 修复。"},{"id":"A21","reason":null,"result":"pending","source":"specs/upstream-sync/spec.md","text":"合并形态与工作树纯净 - **WHEN** 本次同步合并提交并完成本地验证 - **THEN** merge commit 恰好两行 parent（合并前 `main` 与 `upstream/main` @ 9851aa3ba），重新 fetch 后 `git rev-list --count HEAD..upstream/main` 为 0；工作树无冲突标记；`pubspec.lock` 由 fork 钉版与镜像重新解析得到且 hosted URL 无 pub.dev 条目；`flutt