d .github` 无结果；`lib/pages/rcmd/view.dart` 同时包含 `AutoScrollPhysics(` 与 `ScaffoldLayout(`/`FloatingActionButton(`；`lib/plugin/pl_player/controller.dart` 的 `_initPlayer` 中不再出现 `'volume-max'` 与 `'volume':`，且存在 `setVolumeCapped(` 调用；`pubspec.lock` 由重解析生成而非手工合并。"},{"id":"A3","source":"brief.md","text":"A3: seek API 对齐上游：`git grep -n 'isSeek' -- lib` 为 0 条；`lib/` 内不存在对已删除 `seek(Duration, {isSeek})` 方法的调用；`PlPlayerController.seekTo` 只有一个 `Duration` 参数；`lib/services/audio_handler.dart` 调用 `seekToIfExists(position)` 不传 `isSeek`。"},{"id":"A4","source":"brief.md","text":"A4: 音量融合成立：`lib/models/common/audio_normalization.dart` 含 `setVolumeCapped`/`alimiter` 实现；`pl_player/controller.dart`、`pages/audio/controller.dart`、`pages/video/widgets/player_focus.dart` 的 >100% 路径均经 `setVolumeCapped`；同时 `maxVolume`、`gestureVolumeMax`、`volumeBoostUnlocked`、`Pref.enableVolumeBoost`、`Pref.enableAppVolume`、`Pref.maxVolume` 仍存在且被使用（`lib/` 引用计数非 0），fork 的「音量增强需二次确认解锁 200%」与桌面最大音量设置行为不变。"},{"id":"A5","source":"brief.md","text":"A5: 离线字幕/视角全收且 fork 入口幸存：`lib/utils/subtitle_utils.dart` 与 `download_service` 中的字幕/章节缓存逻辑在位；`lib/pages/video/widgets/header_control.dart` 不再包含被迁走的字幕下载实现；同文件中 fork 的作者专属倍速入口仍在（`author_play_speed`/作者倍速相关引用非 0）；`view_point` 跳转与视角偏好入口可达。"},{"id":"A6","source":"brief.md","text":"A6: 推荐源多选落地：`lib/models/common/rcmd_source.dart`、`Pref.rcmdSources`、`SettingBoxKey.rcmdSources`、设置页的带说明多选对话框均存在；`lib/pages/rcmd/controller.dart` 按多源交错取数；`lib/` 内不存在 `Pref.rcmdMode`/`RcmdMode` 的悬空调用（若上游保留定义但无消费者，允许定义存在，调用计数为 0）；fork 的 `AutoScrollPhysics` 仍在 `rcmd/view.dart` 生效。"},{"id":"A7","source":"brief.md","text":"A7: fork 自有功能全量幸存：ThreadRipper（`lib/services/thread_ripper/**` 文件数与合并前一致）、屏蔽画质、双击区域调整与预览、两指轻点暂停、作者专属倍速、会员视频本地筛选、我的页横向预览卡片与稍后再看直删、推荐页滚动、悬浮底栏三种显示样式；对应标识在 `lib/` 内引用计数均非 0，且与合并前基线持平。"},{"id":"A8","source":"brief.md","text":"A8: 版本线与钉版：`pubspec.yaml` 仍含 `connectivity_plus: 7.0.0`、`device_info_plus: 13.0.0`、`file_picker: 12.0.0-beta.7`，`environment.flutter` 与 `.fvmrc` 均为 `3.47.9`，`version` 与上游 `pub