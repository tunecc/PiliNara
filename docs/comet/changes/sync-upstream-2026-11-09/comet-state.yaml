滚动偏移、拖拽关闭长图、文章消息空图、按 issue 号的修复与依赖升级，不夹带 fork 侧的回退。"},{"id":"A18","reason":null,"result":"pending","source":"specs/upstream-sync/spec.md","text":"seek API 重构对齐且 fork 行为不回退 - **WHEN** 上游 `ef30e2482` 移除 `seek()` 与 `isSeek` 参数（原 `isSeek: true` 用于拖动进度条时等待首帧防抖） - **THEN** 合并后 `lib/` 内不存在任何 `isSeek` 引用；`PlPlayerController.seekTo` 只有一个 `Duration` 参数；fork 的全部调用点（`services/audio_handler.dart` 的 `seekToIfExists(position)`、`pages/video/controller.dart`、`plugin/pl_player/widgets/bottom_control.dart`、`plugin/pl_player/view/view.dart`、`pages/video/post_panel/view.dart`、`lib/utils/ios/pip_helper.dart`）对齐上游新签名；fork 的双击分向时长接线（SeekIndicator GlobalKey、`fastBackwardDuration`/`fastForwardDuration`）、两指轻点暂停、双击分区 `resolveType` 不回退；键盘 ←/→ 的分向时长单触发路径保持。"},{"id":"A19","reason":null,"result":"pending","source":"specs/upstream-sync/spec.md","text":"音量 >100% 走限幅且 fork 音量能力保留 - **WHEN** 上游 `d7df91620` 将 mpv 音量恒 ≤100、>100% 增益挪入 af 链 `alimiter=level_in=X:limit=1:level=0`（`setVolumeCapped`，Android libmpv 无 volume 滤镜故用 alimiter） - **THEN** `lib/models/common/audio_normalization.dart` 的 `setVolumeCapped`/`_boostAf` 在位；`pl_player/controller.dart` `_initPlayer` 不再设置 `'volume'`/`'volume-max'`，改在创建后调用 `setVolumeCapped`；`pages/audio/controller.dart`、`pages/video/widgets/player_focus.dart` 的音量路径同样经 `setVolumeCapped`；fork 的桌面 `Pref.maxVolume`（≤300%）、移动端应用内音量模式（`enableAppVolume`/`Pref.appVolume`）、音量增强二次确认解锁 200%（`enableVolumeBoost`、`volumeBoostUnlocked`、`gestureVolumeMax`、`onVolumeGestureEnd`）语义全部保留且消费者计数不为 0。"},{"id":"A20","reason":null,"result":"pending","source":"specs/upstream-sync/spec.md","text":"离线字幕/视角全收且 fork 入口幸存 - **WHEN** 上游 `f67a90291` 将字幕下载逻辑迁出 `header_control.dart`（`subtitle_utils` + `download_service`），并在 `pages/video/controller.dart` 加入离线字幕/视角逻辑 - **THEN** `lib/utils/subtitle_utils.dart` 与下载服务的字幕/章节缓存路径在位；`header_control.dart` 不含被迁走的实现；同文件 fork 的作者专属倍速入口仍在；`pages/video/controller.dart` 中上游离线字幕/视角逻辑与 fork 的屏蔽画质（`blockedQualities`/`fallbackVideo` 兜底）与作者倍速（`applyAuthorDefaultSpeed`）共处、互不删除；视角跳转（