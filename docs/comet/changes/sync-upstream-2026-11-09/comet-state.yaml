e_suffix` 输入。"},{"id":"A10","source":"brief.md","text":"A10: 依赖刷新：`pubspec.lock` 的 hosted URL 全为 `pub.flutter-io.cn`（0 条 pub.dev）；与上游 `pubspec.lock` 的结构化差异仅限三钉及其传递伴随包（`file_picker_darwin/linux/web/platform_interface`、`android/windows_file_picker`）；`material_ui`/`cupertino_ui` 版本与上游一致（1.10.0 / 1.1.6）。"},{"id":"A11","source":"brief.md","text":"A11: `flutter analyze` 相对合并前基线不新增 error / warning（存量 info 允许；基线以本 change 记录的合并前计数为准）。"},{"id":"A12","source":"brief.md","text":"A12: `flutter test` 全部通过，包含上游新增测试 `test/cdn_node_store_test.dart`、`test/utils/dlna_utils_test.dart`、`test/utils/desktop/window_bounds_test.dart`、`test/video_utils_test.dart`、`test/pages/login/geetest/captcha_config_test.dart`；已知 flaky 项允许重跑一次并记录。"},{"id":"A13","source":"brief.md","text":"A13: `CHANGELOG.md` 的 `## [Unreleased]` 下新增「### 同步上游 2.6.2 批次（2026-11-09）」条目，内容涵盖本批吸收的上游主要能力与修复、fork 自有差异保持不变、`dlna_dart` 依赖形态变化与未恢复裁剪 workflow；既有条目与文件结构不被改写。"},{"id":"A14","source":"brief.md","text":"A14: `README.md` 保留 fork 的差异说明结构，且 Flutter 版本描述与 `.fvmrc` 一致（3.47.9，跟随上游），不再出现\"固定为 3.47.0…不跟随上游升级\"。"},{"id":"A15","source":"brief.md","text":"A15: 提交前工作树纯净：无补丁污染文件，`geetest_plugin.dart` 不在工作树；`git status` 仅包含本 change 的实现与正式产物；提交后 `git status` 干净。"},{"id":"A16","source":"brief.md","text":"A16: 上游本批新配置项落地可用：`showRefreshFAB` 在桌面设置页有入口并作用于推荐页 FAB；推荐源多选在推荐设置可达；`foldDepth` 影响楼中楼折叠；离线字幕/章节在下载后离线播放可用（代码路径存在，行为由上游实现保证）。"},{"id":"A17","source":"specs/upstream-sync/spec.md","text":"上游功能与缺陷修复全收 - **WHEN** 上游在本批范围内新增功能或修复缺陷，且 fork 对这些文件没有冲突性更改 - **THEN** 合并结果完整采用上游实现：推荐来源多选（`rcmd_source.dart`、`Pref.rcmdSources`、带说明的多选对话框、按勾选顺序交错取数）、桌面推荐页刷新 FAB（`showRefreshFAB`）与刷新指示器修复、评论楼中楼线程树（`reply_threaded_indent_box.dart`、`reply_reply/tree.dart`、`foldDepth`）、离线字幕/视角（`subtitle_utils.dart`、`download_service.dart`、`Pref.cachePlayInfo`、视角跳转与偏好）、>100% 音量 alimiter 限幅（`setVolumeCapped`）、音频会话与本地音频打开修复、直播横屏全屏安全区、小窗/通知栏刷新与弹幕按钮、桌面最小窗口尺寸（`window_bounds.dart`）、DLNA Lebo 控制 URL 归一（`dlna_utils.dart`）、搜索 `#` 视频标签筛选、AI 对话中途停止、iOS 短信验证码注册刷新、剧集滚动偏移、拖拽关闭长图、文章消息空图、按 issue 号的修复与依赖升级，不夹带 fork 侧的回退。"},{"id":"A18","source":"specs/upstream-sync/spec.md","text":"seek API 重构对齐且 fork 行为不回退 - **WHEN** 上游 `ef30e2482` 移除 `seek()` 与 `isSeek` 参数（原 `isSeek: true` 用于拖动进度条时等待首帧防抖） - **THEN** 合并后 `lib/` 内不存在任何 `isSeek` 引用；`PlPlayerController.seekTo` 只有一个 `Duration` 参数；fork 的全部调用点（`services/audio_handler.dart` 的 `seekToIfExists(position)`、`pages/video/controller.dart`、`plugin/pl_player/widgets/bottom_control.dart`、`plugin/pl_player/view/view.dart`、`pages/video/post_panel/view.dart`、`lib/utils/ios/pip_helper.dart`）对齐上游新签名；fork 的双击分向时长接线（SeekIndicator GlobalKey、`fastBackwardDuration`/`fastForwardDuration`）、两指轻点暂停、双击分区 `resolveType` 不回退；键盘 ←/→ 的分向时长单触发路径保持。"},{"id":"A19","source":"specs/upstream-sync/spec.md","text":"音量 >100% 走限幅且 fork 音量能力保留 - **WHEN** 上游 `d7df91620` 将 mpv 音量恒 ≤100、>100% 增益挪入 af 链 `alimiter=level_in=X:limit=1:level=0`（`setVolumeCapped`，Android libmpv 无 volume 滤镜故用 alimiter） - **THEN** `lib/models/common/audio_normalization.dart` 的 `setVolumeCapped`/`_boostAf` 在位；`pl_player/controller.dart` `_initPlayer` 不再设置 `'volume'`/`'volume-max'`，改在创建后调用 `setVolumeCapped`；`pages/audio/controller.dart`、`pages/video/widgets/player_focus.dart` 的音量路径同样经 `setVolumeCapped`；fork 的桌面 `Pref.maxVolume`（≤300%）、移动端应用内音量模式（`enableAppVolume`/`Pref.appVolume`）、音量增强二次确认解锁 200%（`enableVolumeBoost`、`volumeBoostUnlocked`、`gestureVolumeMax`、`onVolumeGestureEnd`）语义全部保留且消费者计数不为 0。"},{"id":"A20","source":"specs/upstream-sync/spec.md","text":"离线字幕/视角全收且 fork 入口幸存 - **WHEN** 上游 `f67a90291` 将字幕下载逻辑迁出 `header_control.dart`（`subtitle_utils` + `download_service`），并在 `pages/video/controller.dart` 加入离线字幕/视角逻辑 - **THEN** `lib/utils/subtitle_utils.dart` 与下载服务的字幕/章节缓存路径在位；`header_control.dart` 不含被迁走的实现；同文件 fork 的作者专属倍速入口仍在；`pages/video/controller.dart` 中上游离线字幕/视角逻辑与 fork 的屏蔽画质（`blockedQualities`/`fallbackVideo` 兜底）与作者倍速（`applyAuthorDefaultSpeed`）共处、互不删除；视角跳转（`61409bb74`）与视角偏好（`8ba530518`）可用。"},{"id":"A21","source":"specs/upstream-sync/spec.md","text":"推荐源多选落地且 fork 滚动行为保留 - *