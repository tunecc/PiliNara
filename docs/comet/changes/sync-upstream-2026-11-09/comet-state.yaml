若执行过 `patch.sh`，补丁污染文件在提交前还原，`geetest_plugin.dart` 不在工作树。"},{"id":"A26","source":"specs/upstream-sync/spec.md","text":"撞车呈报规则 - **WHEN** fork 已实现的某功能，上游在本批中也做了同类实现（同一用户可见功能、不同写法） - **THEN** 该条目不自动裁决；由 Agent 呈报双方差异，用户选择保留 fork 版 / 采用上游版 / 融合，结论记入 brief `# 决策` 并落盘 - **本批排查结论**：上游未实现 fork 任何自有功能（fork 标识与中文关键词在上游全树 0 命中，fork 功能目录本批上游提交数为 0，双侧改动文件交集 16 个且不含 fork 功能主文件），无二选一项；4 个语义交互点均为\"上游结构 + fork 行为\"的融合，不是功能撞车。"}],"children":null,"formalHash":"ca5d880bf16a07d711bfff03d0d9c03092810b1d3f2ca3b41596f1ed82292bb5","semanticSnapshot":{"artifacts":[{"auxiliary":[],"commentsHash":"cda738d4fb7d0dbdff20df1cd09b859740e0671de31bcf78b8ddc8ff818dab92","contentHash":"2a586d2b6b157922a53d16776a73e80f065f550097c876ad53d930833972cab7","contractHash":"66c377cc18e60aa1d4cf19e0c9b301a66f92b3b7dccc0376cfac87e881c5882d","inputHash":"44a5a6d4898442da54e80965025be2713c380fbcfec2639c89b19ca6cb167d7c","legacyFingerprint":"d160b69b48872448cc3607db283ab3299545ffd34da56b2265dfcaa162ce4a69","source":"brief.md"},{"auxiliary":[],"commentsHash":"cda738d4fb7d0dbdff20df1cd09b859740e0671de31bcf78b8ddc8ff818dab92","contentHash":"cec798f0c49b6031538bf4b62b71dff362e9fbc82bccfb3e1c59d30e541c70f1","contractHash":"f914745d970e509cd5e10f7744d848e8d8e44509cd84bd76751728046cb09d39","inputHash":"58be1ae30b07516c20c27a87bed3f578a18c5dba0bb685b734b4e66ccb0eb999","legacyFingerprint":"b3ed51205e95ffed232f5306eecf51b164d853fb20d99244e454cff8e9e41d62","source":"specs/upstream-sync/spec.md"}],"schema":"comet.native.shape-semantics.v1"},"shapeConfirmationHash":"3f86beb4f3de566010c4e0eaaf296a88e2bae7591ed2c7922d35c6252d6c7929","specChanges":[{"capability":"upstream-sync","operation":"modify","source":"specs/upstream-sync/spec.md"}]},{"sequence":2,"value":{"choice":"approved","proposal":{"input":{"artifactRootRef":"docs","name":"sync-upstream-2026-11-09","task":"继续同步上游更新，保留我们自己的修改。如果我们做的功能上游有增加了，你就询问一下，分析一下，看一下保留上游的还是我们自己的更好。"},"outputs":{"shape.prepare":{"acceptance":[{"id":"A1","source":"brief.md","text":"A1: 合并后重新 `git fetch upstream`，`git rev-list --count HEAD..upstream/main` 为 0（上游停点 `eca9c04eb`）；`main` 上新增一个双亲 merge commit，两个 parent 分别为合并前 `main`（`09379e6c1`）与 `upstream/main`@`eca9c04eb`，恰好两行 parent；未使用 squash 或 rebase。"},{"id":"A2","source":"brief.md","text":"A2: 7 处冲突全部按范围裁决落定：`git grep -n '^<<<<<<<' -- lib .gitignore CHANGELOG.md README.md .github` 无结果；`lib/pages/rcmd/view.dart` 同时包含 `AutoScrollPhysics(` 与 `ScaffoldLayout(`/`FloatingActionButton(`；`lib/plugin/pl_player/controller.dart` 的 `_initPlayer` 中不再出现 `'volume-max'` 与 `'volume':`，且存在 `setVolumeCapped(` 调用；`pubspec.lock` 由重解析生成而非手工合并。"},{"id":"A3","source":"brief.md","text":"A3: seek API 对齐上游：`git grep -n 'isSeek' -- lib` 为 0 条；`lib/` 内不存在对已删除 `seek(Duration, {isSeek})` 方法的调用；`PlPlayerController.seekTo` 只有一个 `Duration` 参数；`lib/services/audio_handler.dart` 调用 `seekToIfExists(position)` 不传 `isSeek`。"},{"id":"A4","source":"brief.md","text":"A4: 音量融合成立：`lib/models/common/audio_normalization.dart` 含 `setVolumeCapped`/`alimiter` 实现；`pl_player/controller.dart`、`pages/audio/controller.dart`、`pages/video/widgets/player_focus.dart` 的 >100% 路径均经 `setVolumeCapped`；同时 `maxVolume`、`gestureVolumeMax`、`volumeBoostUnlocked`、`Pref.enableVolumeBoost`、`Pref.enableAppVolume`、`Pref.maxVolume` 仍存在且被使用（`lib/` 引用计数非 0），fork 的「音量增强需二次确认解锁 200%」与桌面最大音量设置行为不变。"},{"id":"A5","source":"brief.md","text":"A5: 离线字幕/视角全收且 fork 入口幸存：`lib/utils/subtitle_utils.dart` 与 `download_service` 中的字幕/章节缓存逻辑在位；`lib/pages/video/widgets/header_control.dart` 不再包含被迁走的字幕下载实现；同文件中 fork 的作者专属倍速入口仍在（`author_play_speed`/作者倍速相关引用非 0）；`view_point` 跳转与视角偏好入口可达。"},{"id":"A6","source":"brief.md","text":"A6: 推荐源多选落地：`lib/models/common/rcmd_source.dart`、`Pref.rcmdSources`、`SettingBoxKey.rcmdSources`、设置页的带说明多选对话框均存在；`lib/pages/rcmd/controller.dart` 按多源交错取数；`lib/` 内不存在 `Pref.rcmdMode`/`RcmdMode` 的悬空调用（若上游保留定义但无消费者，允许定义存在，调用计数为 0）；fork 的 `AutoScrollPhysics` 仍在 `rcmd/view.dart` 生效。"},{"id":"A7","source":"brief.md","text":"A7: fork 自有功能全量幸存：ThreadRipper（`lib/services/thread_ripper/**` 文件数与