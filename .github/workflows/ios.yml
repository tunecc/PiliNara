name: Build for iOS

on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to build"
        required: false
        default: ""
        type: string
      tag:
        description: "tag"
        required: false
        default: ""
        type: string
      artifact_name:
        description: "Artifact name"
        required: false
        default: "iOS-release"
        type: string
      file_suffix:
        description: "Optional IPA filename suffix"
        required: false
        default: ""
        type: string
  workflow_dispatch:

jobs:
  build-macos-app:
    name: Release IOS
    runs-on: macos-26
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Setup flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml

      - name: Set and Extract version
        shell: pwsh
        run: lib/scripts/build.ps1

      - name: Apply Patch
        shell: pwsh
        run: lib/scripts/patch.ps1 iOS
        continue-on-error: true

      - name: Build iOS
        run: |
          flutter build ios \
            --release \
            --no-codesign \
            --config-only \
            --dart-define-from-file=pili_release.json

          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination generic/platform=iOS \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build

          rm -rf Payload
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          IPA_NAME="PiliNara_ios_${{env.version}}${{ inputs.file_suffix }}.ipa"
          ditto -c -k --sequesterRsrc --keepParent Payload "$IPA_NAME"
          echo "ipa_path=$IPA_NAME" >> "$GITHUB_ENV"

      - name: Release
        if: ${{ inputs.tag != '' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          files: ${{ env.ipa_path }}

      - name: Upload ios release
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ env.ipa_path }}
