name: Build for iOS

on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to build"
        required: false
        default: ""
        type: string
      tag:
        description: "tag"
        required: false
        default: ""
        type: string
      artifact_name:
        description: "Artifact name"
        required: false
        default: "iOS-release"
        type: string
      file_suffix:
        description: "Optional IPA filename suffix"
        required: false
        default: ""
        type: string
  workflow_dispatch:

jobs:
  build-macos-app:
    name: Release IOS
    runs-on: macos-26
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Setup flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml

      - name: Set and Extract version
        shell: pwsh
        run: lib/scripts/build.ps1

      - name: Apply Patch
        shell: pwsh
        run: lib/scripts/patch.ps1 iOS
        continue-on-error: true

      - name: Disable code signing
        run: |
          sed -i '' 's/"CODE_SIGN_IDENTITY\[sdk=iphoneos\*\]" = "iPhone Developer"/"CODE_SIGN_IDENTITY[sdk=iphoneos*]" = ""/g' ios/Runner.xcodeproj/project.pbxproj
          sed -i '' 's/CODE_SIGNING_REQUIRED = YES/CODE_SIGNING_REQUIRED = NO/g' ios/Runner.xcodeproj/project.pbxproj
          sed -i '' '/DEVELOPMENT_TEAM/s/= ".*"/= ""/g' ios/Runner.xcodeproj/project.pbxproj

      - name: Build iOS
        run: |
          flutter build ios --release --no-codesign --dart-define-from-file=pili_release.json
          rm -rf Payload
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload PiliNara_ios_${{env.version}}${{ inputs.file_suffix }}.ipa
          cp PiliNara_ios_${{env.version}}${{ inputs.file_suffix }}.ipa PiliNara_ios_${{env.version}}${{ inputs.file_suffix }}.tipa

      - name: Release
        if: ${{ inputs.tag != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          files: |
            PiliNara_ios_*${{ inputs.file_suffix }}.ipa
            PiliNara_ios_*${{ inputs.file_suffix }}.tipa

      - name: Upload ios release
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_name }}
          path: |
            PiliNara_ios_*${{ inputs.file_suffix }}.ipa
            PiliNara_ios_*${{ inputs.file_suffix }}.tipa
