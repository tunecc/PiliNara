name: Reusable Android Build

on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to build"
        required: false
        default: ""
        type: string
      tag:
        description: "Publish release when non-empty; actual tag uses build number"
        required: false
        default: ""
        type: string
      dev:
        description: "Whether to build dev variant"
        required: false
        default: false
        type: boolean
      target_platforms:
        description: "Flutter target platforms"
        required: false
        default: "android-arm,android-arm64,android-x64"
        type: string
      upload_arm64_v8a:
        description: "Upload arm64-v8a artifact"
        required: false
        default: true
        type: boolean
      upload_armeabi_v7a:
        description: "Upload armeabi-v7a artifact"
        required: false
        default: true
        type: boolean
      upload_x86_64:
        description: "Upload x86_64 artifact"
        required: false
        default: true
        type: boolean
    secrets:
      SIGN_KEYSTORE_BASE64:
        required: false
      KEYSTORE_PASSWORD:
        required: false
      KEY_ALIAS:
        required: false
      KEY_PASSWORD:
        required: false

jobs:
  android:
    name: Release Android
    runs-on: ubuntu-latest
    permissions: write-all

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"
          cache-dependency-path: |
            android/*.gradle*
            android/**/gradle-wrapper.properties

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Apply Patch
        shell: pwsh
        run: lib/scripts/patch.ps1 android
        continue-on-error: true

      - name: Write key
        shell: bash
        env:
          SIGN_KEYSTORE_BASE64: ${{ secrets.SIGN_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "${SIGN_KEYSTORE_BASE64}" ]; then
            echo "${SIGN_KEYSTORE_BASE64}" | base64 --decode > android/app/key.jks
            echo storeFile='key.jks' >> android/key.properties
            echo storePassword='${KEYSTORE_PASSWORD}' >> android/key.properties
            echo keyAlias='${KEY_ALIAS}' >> android/key.properties
            echo keyPassword='${KEY_PASSWORD}' >> android/key.properties
          fi

      - name: Set and Extract version
        shell: pwsh
        run: lib/scripts/build.ps1 android

      - name: Prefetch media-kit libmpv jars
        shell: bash
        run: |
          set -euo pipefail

          flutter pub get

          # media_kit_libs_android_video 在其 build.gradle 里用单次、无重试的
          # 请求从 GitHub Releases 下载 libmpv jar，偶发的 HTTP 504 会让整个
          # Gradle 构建失败。该 task 在目标文件已存在且 SHA-256 匹配时会跳过
          # 下载，因此这里带重试预下载到同一位置。URL / 校验和 / 目标路径
          # 直接从 pinned 的 build.gradle 解析，与锁定的 media-kit ref 保持
          # 一致；若上游格式变化导致解析不到条目，此步骤会失败以便及时发现。
          resolved_ref=$(awk '/^  media_kit_libs_android_video:/{p=1} p && /resolved-ref:/{split($0,a,"\""); print a[2]; exit}' pubspec.lock)
          pub_cache="${PUB_CACHE:-$HOME/.pub-cache}"
          pkg="$pub_cache/git/media-kit-${resolved_ref}/libs/android/media_kit_libs_android_video/android"
          gradle_file="$pkg/build.gradle"

          if [ ! -f "$gradle_file" ]; then
            echo "media-kit checkout not found at $pkg" >&2
            exit 1
          fi

          grep -oE '\["url": "[^"]+", "sha256": "[^"]+", "destination": file\("\$buildDir/[^"]+"\)\]' "$gradle_file" |
          while IFS= read -r entry; do
            url=$(printf '%s' "$entry" | sed -n 's/.*"url": "\([^"]*\)".*/\1/p')
            sha=$(printf '%s' "$entry" | sed -n 's/.*"sha256": "\([^"]*\)".*/\1/p')
            dest_rel=$(printf '%s' "$entry" | sed -n 's/.*\$buildDir\/\([^"]*\)".*/\1/p')
            dest="$pkg/build/$dest_rel"

            if [ -f "$dest" ] && [ "$(sha256sum "$dest" | awk '{print $1}')" = "$sha" ]; then
              echo "Already present and valid: $dest"
              continue
            fi

            mkdir -p "$(dirname "$dest")"
            echo "Downloading $url"
            curl --fail --location --silent --show-error \
              --retry 5 --retry-delay 5 --retry-all-errors \
              --output "$dest.part" "$url"

            actual_sha=$(sha256sum "$dest.part" | awk '{print $1}')
            if [ "$actual_sha" != "$sha" ]; then
              echo "SHA-256 mismatch for $dest.part (expected $sha, got $actual_sha)" >&2
              exit 1
            fi
            mv "$dest.part" "$dest"
            echo "Cached: $dest"
          done

      - name: Build Android APKs
        shell: bash
        run: |
          set -euo pipefail

          args=(
            build apk
            --release
            --split-per-abi
            --target-platform "${{ inputs.target_platforms }}"
            --dart-define-from-file=pili_release.json
            --pub
          )

          if [ "${{ inputs.dev }}" = "true" ]; then
            args+=(--android-project-arg dev=1)
          fi

          flutter "${args[@]}"

      - name: Rename APKs
        shell: bash
        run: |
          for file in build/app/outputs/flutter-apk/app-*-release.apk; do
            abi=$(echo "$file" | sed -E 's|.*app-(.*)-release\.apk|\1|')
            mv "$file" "PiliNara_android_${{ env.version }}_${abi}.apk"
          done

      - name: Release to GitHub
        if: ${{ inputs.tag != '' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.release_tag }}
          name: ${{ env.release_tag }}
          files: |
            PiliNara_android_*.apk
            release-manifest.json

      - name: Upload arm64-v8a
        if: ${{ inputs.upload_arm64_v8a }}
        uses: actions/upload-artifact@v7
        with:
          name: Android_arm64-v8a
          path: PiliNara_android_*_arm64-v8a.apk

      - name: Upload armeabi-v7a
        if: ${{ inputs.upload_armeabi_v7a }}
        uses: actions/upload-artifact@v7
        with:
          name: Android_armeabi-v7a
          path: PiliNara_android_*_armeabi-v7a.apk

      - name: Upload x86_64
        if: ${{ inputs.upload_x86_64 }}
        uses: actions/upload-artifact@v7
        with:
          name: Android_x86_64
          path: PiliNara_android_*_x86_64.apk
