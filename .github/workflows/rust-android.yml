name: Rust Android Native Build

on:
  push:
    branches: [main, feat/kotlin-rust-build]
    paths:
      - 'rust/**'
      - '.github/workflows/rust-android.yml'
  pull_request:
    branches: [main]
    paths:
      - 'rust/**'
      - '.github/workflows/rust-android.yml'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: stable

jobs:
  build-android:
    name: Build Android native libs (${{ matrix.abi }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            target: aarch64-linux-android
            api: 21
          - abi: armeabi-v7a
            target: armv7-linux-androideabi
            api: 21
          - abi: x86_64
            target: x86_64-linux-android
            api: 21
          - abi: x86
            target: i686-linux-android
            api: 21

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27b
          link-to-sdk: true

      - name: Build Rust library
        run: |
          cd rust
          export ANDROID_NDK_HOME=$ANDROID_NDK_HOME
          export CC_${{ matrix.target }}=${{ matrix.target }}${{ matrix.api }}-clang
          export CXX_${{ matrix.target }}=${{ matrix.target }}${{ matrix.api }}-clang++
          export AR_${{ matrix.target }}=llvm-ar
          cargo build --release --target ${{ matrix.target }}
        
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libpilinara-native-${{ matrix.abi }}
          path: rust/target/${{ matrix.target }}/release/libpilinara_native.so
          retention-days: 7

  build-all-and-package:
    name: Package all ABIs
    needs: build-android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: jniLibs/

      - name: Structure jniLibs
        run: |
          for dir in jniLibs/*/; do
            abi=$(basename "$dir")
            mkdir -p "android/app/src/main/jniLibs/$abi"
            mv "$dir"*.so "android/app/src/main/jniLibs/$abi/" 2>/dev/null || true
          done

      - name: Upload packaged jniLibs
        uses: actions/upload-artifact@v4
        with:
          name: pilinara-jnilibs
          path: android/app/src/main/jniLibs/
          retention-days: 7

  test-rust:
    name: Test Rust library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run tests
        run: |
          cd rust
          cargo test --lib
