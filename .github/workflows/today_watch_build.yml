name: Build PiliNara (TodayWatch)

on:
  push:
    branches: [main, master]
    paths:
      - 'lib/services/today_watch/**'
      - 'lib/pages/today_watch/**'
      - 'lib/models_new/today_watch/**'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (optional)'
        required: false
        default: ''
        type: string

env:
  FLUTTER_VERSION: '3.47.0'

jobs:
  analyze:
    name: Analyze Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      
      - name: Get dependencies
        run: flutter pub get
      
      - name: Analyze
        run: flutter analyze --no-fatal-infos

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: analyze
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      
      - name: Get dependencies
        run: flutter pub get
      
      - name: Build APK
        run: |
          flutter build apk --release --split-per-abi \
            --target-platform android-arm,android-arm64,android-x64
      
      - name: Rename APKs
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | tr '+' '-')
          for abi in arm64-v8a armeabi-v7a x86_64; do
            if [ -f "build/app/outputs/flutter-apk/app-$abi-release.apk" ]; then
              mv "build/app/outputs/flutter-apk/app-$abi-release.apk" \
                 "PiliNara_todaywatch_$VERSION_${abi}.apk"
            fi
          done
      
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: PiliNara-TodayWatch-APKs
          path: PiliNara_todaywatch_*.apk
          retention-days: 30
      
      - name: Create GitHub Release
        if: github.event.inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: PiliNara TodayWatch ${{ github.event.inputs.tag }}
          files: PiliNara_todaywatch_*.apk
          draft: true
